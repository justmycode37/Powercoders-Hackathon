<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#fcfcfc" />
  <title>Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script>
    // Pick the theme before first paint: saved choice, else the system setting
    (function () {
      let saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      const sys = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : sys;
    })();
  </script>
  <style>
    :root {
      --bar-bg: #ffffff;
      --bar-text: #1c1c1e;
      --bar-secondary: #8e8e93;
      --icon: #000000;
      --pressed: #f2f2f7;
      --clear-bg: #c7c7cc;
      --page-bg: #fcfcfc;
      --sheet-bg: #ffffff;
      --row-bg: #f2f2f7;
      --done: #34c759;
      --glass: rgba(246,246,248,.82);
      --card: #ffffff;
      --hair: rgba(60,60,67,.12);
      --shadow: 0 6px 24px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08);
      --user-blue: #0a84ff;
      --pin-red: #ff3b30;
      --spring: cubic-bezier(.32,.72,0,1);
      --bounce: cubic-bezier(.34,1.45,.64,1);
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bar-bg: #2c2c2e;
      --bar-text: #ffffff;
      --bar-secondary: #98989f;
      --icon: #ffffff;
      --pressed: #3a3a3c;
      --clear-bg: #636366;
      --page-bg: #1c1f24;
      --sheet-bg: #1c1c1e;
      --row-bg: #3a3a3c;
      --done: #1f8a3b;
      --glass: rgba(28,28,30,.78);
      --card: rgba(58,58,60,.72);
      --hair: rgba(255,255,255,.1);
      --shadow: 0 6px 24px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.3);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--page-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      overscroll-behavior: none;
    }
    #map { position: fixed; inset: 0; }
    .maplibregl-control-container { display: none; }

    /* Shared round floating button */
    .fab {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--bar-bg);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      color: var(--icon);
      cursor: pointer;
      transition: background-color .3s ease, color .3s ease;
    }
    .fab:active { background: var(--pressed); }
    .fab svg { width: 22px; height: 22px; grid-area: 1 / 1; }

    /* Top-right menu: the dots button fans out into more buttons to its left */
    .menu {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      right: 12px;
      width: 44px;
      height: 44px;
      z-index: 20;
    }
    .menu .fab { position: absolute; top: 0; right: 0; }
    .menu-item {
      opacity: 0;
      transform: translateX(0) scale(.4);
      pointer-events: none;
      transition: transform .5s var(--spring), opacity .2s ease, background-color .3s ease, color .3s ease;
    }
    .menu.open .menu-item { opacity: 1; pointer-events: auto; transition: transform .55s var(--bounce), opacity .25s ease, background-color .3s ease, color .3s ease; }
    .menu.open .menu-item[data-slot="1"] { transform: translateX(-54px) scale(1); }
    .menu.open .menu-item[data-slot="2"] { transform: translateX(-108px) scale(1); transition-delay: .04s; }
    .menu.open .menu-item[data-slot="3"] { transform: translateX(-162px) scale(1); transition-delay: .08s; }
    /* Toggled-on button (e.g. events shown) */
    .fab.active { background: var(--user-blue); color: #fff; }
    .fab.active:active { background: #0070e0; }
    .menu-main { z-index: 1; }
    .menu-main svg { transition: transform .4s var(--spring), opacity .2s ease; }
    .menu-main .ic-close { opacity: 0; transform: rotate(-90deg) scale(.5); }
    .menu.open .menu-main .ic-dots { opacity: 0; transform: rotate(90deg) scale(.5); }
    .menu.open .menu-main .ic-close { opacity: 1; transform: none; }

    /* Theme icon: moon in light mode (tap → dark), sun in dark mode (tap → light) */
    .theme-btn svg { transition: transform .45s var(--spring), opacity .25s ease; }
    .theme-btn .ic-sun { opacity: 0; transform: rotate(-90deg) scale(.5); }
    :root[data-theme="dark"] .theme-btn .ic-moon { opacity: 0; transform: rotate(90deg) scale(.5); }
    :root[data-theme="dark"] .theme-btn .ic-sun { opacity: 1; transform: none; }

    /* Small status toast (e.g. location unavailable) */
    .toast {
      position: fixed;
      left: 50%;
      top: calc(env(safe-area-inset-top) + 68px);
      transform: translate(-50%, -8px);
      max-width: calc(100% - 32px);
      padding: 10px 16px;
      border-radius: 18px;
      background: var(--bar-bg);
      color: var(--bar-text);
      box-shadow: var(--shadow);
      font-size: 14px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .35s var(--spring);
      z-index: 30;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* Bottom search area (bar + results) */
    .search-wrap {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(env(safe-area-inset-bottom) + 12px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none; /* only the bar/list catch taps, so the map stays draggable beside the circle */
    }
    .search-wrap > * { pointer-events: auto; }

    .results {
      display: none;
      max-height: 50vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: var(--bar-bg);
      border-radius: 18px;
      box-shadow: var(--shadow);
      list-style: none;
      margin: 0;
      padding: 4px 0;
    }
    .results.open { display: block; }
    .results::-webkit-scrollbar { display: none; }
    .results li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .results li.more {
      justify-content: center;
      color: var(--bar-secondary);
      font-size: 15px;
      font-weight: 500;
    }
    .results li .text { flex: 1; min-width: 0; padding: 2px 0; }
    .results li:active { background: var(--pressed); }
    .results .icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--pin-red);
    }
    .results .icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .results .title,
    .results .subtitle {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .results .title { font-size: 16.5px; font-weight: 600; color: var(--bar-text); }
    .results .subtitle { font-size: 13px; color: var(--bar-secondary); margin-top: 1px; }
    .results .empty { color: var(--bar-secondary); font-size: 15px; cursor: default; }

    .search {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-left: auto;
      padding: 0 8px 0 16px;
      background: var(--bar-bg);
      border-radius: 26px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: width .45s var(--spring), padding .45s var(--spring), gap .45s var(--spring), background-color .3s ease;
    }
    .search input, .search .clear { transition: opacity .2s ease; }

    /* Collapsed: the bar morphs into a circle in the bottom-right corner */
    .search-wrap.collapsed .search {
      width: 52px;
      gap: 0;
      padding: 0 0 0 16.5px; /* (52 - 19) / 2 keeps the magnifier centred */
      cursor: pointer;
    }
    .search-wrap.collapsed .search input,
    .search-wrap.collapsed .search .clear { opacity: 0; pointer-events: none; }
    .search-wrap.collapsed .search .clear { display: none; }
    .search-wrap.collapsed .results { display: none; }

    /* ===== Journey (Apple Maps–style) ===== */
    .glass {
      background: var(--glass);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
    }

    /* Top pill: depart · slim progress line · arrive */
    .j-pill {
      position: fixed;
      left: 12px;
      right: 12px;
      top: calc(env(safe-area-inset-top) + 10px);
      z-index: 15;
      height: 54px;
      display: none;
      align-items: center;
      gap: 2px;
      padding: 0 6px;
      color: var(--bar-text);
      border-radius: 27px;
      box-shadow: 0 8px 30px rgba(0,0,0,.18), 0 0 0 .5px var(--hair);
    }
    body.journey-mode .j-pill { display: flex; animation: pill-in .55s var(--spring) both; }
    @keyframes pill-in { from { transform: translateY(-130%); } to { transform: none; } }
    body.journey-mode .menu { top: calc(env(safe-area-inset-top) + 76px); }
    .menu { transition: top .45s var(--spring); }
    .j-time {
      flex: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      padding: 5px 10px;
      border-radius: 18px;
      cursor: pointer;
      text-align: left;
      line-height: 1.1;
    }
    #jArrBtn { text-align: right; }
    .j-time:active { background: var(--pressed); }
    .j-time small { display: block; font-size: 11px; font-weight: 500; color: var(--bar-secondary); }
    .j-time b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
    .j-bar { flex: 1; position: relative; height: 18px; margin: 0 4px; }
    .j-layer { position: absolute; inset: 0; }
    .j-layer.done { clip-path: inset(-8px calc(100% - var(--p, 0%)) -8px -8px); }
    .j-base { position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); background: var(--bar-secondary); opacity: .22; border-radius: 1px; }
    .j-seg { position: absolute; top: 50%; transform: translateY(-50%); }
    .j-seg.ride { height: 4px; border-radius: 2px; background: var(--seg, var(--bar-text)); }
    .j-seg.walk { height: 0; border-top: 2px dotted var(--bar-secondary); }
    .j-layer.done .j-seg.ride { background: var(--done); }
    .j-layer.done .j-seg.walk { border-top-color: var(--done); }
    .j-layer.done .j-base { background: var(--done); opacity: 1; }
    .j-node {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--bar-bg);
      border: 2px solid var(--bar-secondary);
      box-sizing: border-box;
      transform: translate(-50%, -50%);
      transition: border-color .3s ease;
      z-index: 1;
    }
    .j-node.end { width: 10px; height: 10px; border-color: var(--bar-text); }
    .j-node.done { border-color: var(--done); }
    .j-now {
      position: absolute;
      top: 50%;
      left: var(--p, 0%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--done);
      border: 2.5px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
      box-sizing: border-box;
      transform: translate(-50%, -50%);
      z-index: 2;
      display: none;
    }
    .j-bar.live .j-now { display: block; }
    /* journey position on the map */
    .route-now { width: 18px; height: 18px; }
    .route-now::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: rgba(52,199,89,.28); animation: pulse 2s ease-out infinite; }
    .route-now::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #34c759; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); }

    /* Bottom sheet: the search bar grows into it */
    .journey {
      display: none;
      flex-direction: column;
      color: var(--bar-text);
      border-radius: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,.22), 0 0 0 .5px var(--hair);
      overflow: hidden;
    }
    .search-wrap.journey-open .search,
    .search-wrap.journey-open .results { display: none; }
    .search-wrap.journey-open .journey { display: flex; animation: j-grow .6s var(--spring) both; }
    .journey > * { animation: j-fade .35s ease .18s both; }
    @keyframes j-grow {
      from { max-height: 52px; border-radius: 26px; }
      to   { max-height: 620px; border-radius: 28px; }
    }
    @keyframes j-fade {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .j-grab { width: 36px; height: 5px; border-radius: 3px; background: var(--bar-secondary); opacity: .35; margin: 7px auto 0; }
    .j-head { display: flex; align-items: flex-start; gap: 12px; padding: 8px 14px 0 20px; }
    .j-dest { flex: 1; min-width: 0; }
    .j-dest b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .j-dest span { display: block; margin-top: 1px; font-size: 15px; color: var(--bar-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .j-close {
      flex: none;
      width: 30px;
      height: 30px;
      margin-top: 2px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: var(--hair);
      color: var(--bar-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .j-close svg { width: 11px; height: 11px; }

    /* Route summary: walk › M15 › M13 › pin */
    .j-strip { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 10px 20px 12px; scrollbar-width: none; }
    .j-strip::-webkit-scrollbar { display: none; }
    .j-chev { flex: none; color: var(--bar-secondary); opacity: .6; font-size: 15px; font-weight: 600; }
    .j-chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 3px 2px;
      border: 0;
      background: transparent;
      color: var(--bar-secondary);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      opacity: .75;
      transition: opacity .2s ease, transform .2s ease;
    }
    .j-chip svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .j-chip.active { opacity: 1; color: var(--bar-text); transform: scale(1.06); }
    .j-chip .j-badge { font-size: 13px; }

    /* Whole journey, top to bottom: time · rail · what happens (stops, rides, walks) */
    .j-list { position: relative; max-height: min(46vh, 430px); overflow-y: auto; overscroll-behavior: contain; padding: 0 12px 6px; scrollbar-width: none; }
    .j-list::-webkit-scrollbar { display: none; }
    .tl-row { --c: var(--bar-secondary); display: grid; grid-template-columns: 46px 22px minmax(0, 1fr); column-gap: 8px; padding: 0 10px 0 6px; border-radius: 14px; cursor: pointer; transition: background-color .2s ease; }
    .tl-row.active { background: var(--hair); }
    .tl-row.done { --c: var(--done); }
    .tl-time { padding: 9px 0; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tl-time small { display: block; font-size: 12px; font-weight: 600; color: #ff3b30; }
    .tl-row.leg .tl-time { font-size: 13px; font-weight: 500; color: var(--bar-secondary); }
    .tl-rail { position: relative; }
    .tl-line { position: absolute; left: 50%; width: 5px; margin-left: -2.5px; background: var(--c); }
    .tl-line.full { top: 0; bottom: 0; }
    .tl-line.top { top: 0; height: 19px; }
    .tl-line.bot { top: 19px; bottom: 0; }
    .tl-line.walk { width: 5px; background: radial-gradient(circle, var(--c) 2px, transparent 2.4px) center top / 5px 9px repeat-y; }
    .tl-node { position: absolute; left: 50%; top: 19px; width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px; border-radius: 50%; background: var(--bar-bg); border: 3.5px solid var(--c); box-sizing: border-box; }
    .tl-node.pin { background: var(--pin-red); border-color: var(--bar-bg); width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
    .tl-body { min-width: 0; padding: 8px 0 10px; }
    .tl-head { display: flex; align-items: baseline; gap: 8px; min-height: 22px; }
    .tl-head b { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tl-plat { flex: none; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tl-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; }
    .tl-title svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; color: var(--bar-secondary); }
    .tl-sub { margin-top: 2px; font-size: 14px; color: var(--bar-secondary); }
    .tl-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tl-tags:empty { display: none; }
    .tl-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 0; border: 0; background: none; color: var(--user-blue); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .tl-link[hidden] { display: none; }
    .tl-link svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
    .tl-link[aria-expanded="true"] svg { transform: rotate(90deg); }
    .tl-dirs, .tl-stops { list-style: none; margin: 6px 0 0; padding: 0; font-size: 14px; }
    .tl-dirs[hidden], .tl-stops[hidden] { display: none; }
    .tl-dirs li { display: flex; align-items: flex-start; gap: 9px; padding: 5px 0; }
    .tl-dirs li svg { flex: none; width: 17px; height: 17px; margin-top: 1px; fill: none; stroke: var(--bar-secondary); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .tl-dirs li span { flex: 1; min-width: 0; }
    .tl-dirs li b { flex: none; font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--hair); font-variant-numeric: tabular-nums; }
    .tl-stops li { display: flex; gap: 10px; padding: 3px 0; color: var(--bar-secondary); }
    .tl-stops time { flex: none; width: 40px; font-variant-numeric: tabular-nums; }

    /* Where to stand: the platform / bay as a sign (white, like the dots on the map) + what is known about it */
    .stand { margin-top: 8px; padding: 12px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.06); cursor: default; }
    .stand-main { display: flex; gap: 12px; }
    .stand-sign { flex: none; align-self: flex-start; width: 62px; min-height: 62px; padding: 6px 4px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; color: #1c1c1e; box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.12); }
    .stand-sign small { font-size: 11px; font-weight: 600; color: #6e6e73; }
    .stand-sign b { font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .stand-sign.long b { font-size: 20px; line-height: 28px; }
    .stand-sign svg { width: 28px; height: 28px; margin: 2px 0; fill: none; stroke: #1c1c1e; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .stand-info { flex: 1; min-width: 0; }
    .stand-kicker { font-size: 12px; font-weight: 600; color: var(--bar-secondary); }
    .stand-main-text { margin-top: 1px; font-size: 16px; font-weight: 700; line-height: 1.25; }
    .stand-main-text:empty { display: none; }
    .stand-next { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: var(--bar-secondary); }
    .stand-next-k { flex: none; white-space: nowrap; }
    .stand-next b { flex: 1; color: var(--bar-text); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stand-arrow { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--bar-text); color: var(--bar-bg); }
    .stand-arrow svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .stand-note { margin-top: 8px; font-size: 13px; color: var(--bar-secondary); }
    .stand-foot { display: flex; justify-content: flex-end; margin-top: 4px; }
    .j-badge {
      flex: none;
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 5px;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }
    .j-tag.plain { background: var(--hair); color: var(--bar-text); }
    .j-tag.strong { background: var(--bar-text); color: var(--bar-bg); }
    .j-delay { color: #ff3b30; font-size: 15px; font-weight: 600; margin-left: 5px; letter-spacing: 0; }

    /* Tapped platform: name + next departures from exactly that platform / stop edge */
    .pf-pop .maplibregl-popup-tip { display: none; }
    .pf-pop .maplibregl-popup-content {
      width: min(280px, calc(100vw - 32px));
      padding: 12px 14px 10px;
      border-radius: 16px;
      background: var(--bar-bg);
      color: var(--bar-text);
      box-shadow: var(--shadow);
      font: inherit;
      font-size: 14px;
    }
    .pf-head { display: flex; align-items: center; gap: 10px; }
    .pf-dot { flex: none; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; display: grid; place-items: center; background: #fff; color: #3a3a3c; box-shadow: 0 0 0 1px rgba(0,0,0,.18); font-size: 15px; font-weight: 700; }
    .pf-name { min-width: 0; }
    .pf-name b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pf-name small { display: block; font-size: 13px; color: var(--bar-secondary); }
    .pf-note { margin: 8px 0 0; font-size: 13px; color: var(--bar-secondary); }
    .pf-note:empty { display: none; }
    .pf-list { list-style: none; margin: 8px 0 0; padding: 0; }
    .pf-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--hair); }
    .pf-list time { flex: none; width: 42px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .pf-to { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pf-list .j-delay { margin-left: 0; font-size: 13px; }
    .j-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .j-tag svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .j-tag.warn { background: rgba(255,149,0,.16); color: #ff9500; }
    .j-tag.ok { background: rgba(52,199,89,.16); color: #34c759; }
    .j-status:empty { display: none; }
    .j-status { padding: 8px 20px 22px; font-size: 15px; color: var(--bar-secondary); }

    /* Time picker sheet */
    .t-dim { position: fixed; inset: 0; z-index: 49; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
    .t-dim.open { opacity: 1; pointer-events: auto; }
    .t-sheet {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(env(safe-area-inset-bottom) + 8px);
      z-index: 50;
      padding: 10px 18px 18px;
      border-radius: 28px;
      background: var(--sheet-bg);
      color: var(--bar-text);
      box-shadow: var(--shadow);
      transform: translateY(130%);
      transition: transform .45s var(--spring), background-color .3s ease;
    }
    .t-sheet.open { transform: none; }
    .t-grab { width: 36px; height: 5px; border-radius: 3px; background: var(--clear-bg); margin: 0 auto 14px; }
    .t-title { font-size: 20px; font-weight: 800; margin-bottom: 14px; }
    .t-seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin-bottom: 14px; border-radius: 12px; background: var(--row-bg); }
    .t-seg button { border: 0; padding: 9px; border-radius: 10px; background: transparent; color: var(--bar-text); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .t-seg button.active { background: var(--bar-bg); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .t-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; padding: 7px 8px 7px 14px; border-radius: 12px; background: var(--row-bg); font-size: 16px; }
    .t-field input { font: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 8px; padding: 6px 10px; background: var(--bar-bg); color: var(--bar-text); }
    .t-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 14px; }
    .t-btn { height: 50px; border: 0; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; }
    .t-btn.primary { background: var(--user-blue); color: #fff; }
    .t-btn.secondary { background: var(--row-bg); color: var(--bar-text); }
    .j-status:empty { display: none; }
    .j-status { padding: 6px 16px 22px; font-size: 15px; color: var(--bar-secondary); }
    .search > svg { flex: none; width: 19px; height: 19px; color: var(--icon); }
    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font: inherit;
      font-size: 17px; /* ≥16px avoids iOS zoom on focus */
      color: var(--bar-text);
      -webkit-appearance: none;
      appearance: none;
    }
    .search input::placeholder { color: var(--bar-secondary); }
    .search input::-webkit-search-cancel-button { display: none; }
    .clear {
      flex: none;
      display: none;
      width: 36px;
      height: 36px;
      border: 0;
      padding: 0;
      background: transparent;
      place-items: center;
      cursor: pointer;
    }
    .clear.show { display: grid; }
    .clear span {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--clear-bg);
      display: grid;
      place-items: center;
    }
    .clear svg { width: 8px; height: 8px; color: var(--bar-bg); }

    /* User location: accuracy halo + blue dot (no `position` on these: MapLibre's marker class keeps position:absolute) */
    /* Event cards floating over their location */
    .ev-card {
      width: 124px;
      padding-bottom: 10px; /* room for the tail, whose tip sits exactly on the event's location */
      cursor: pointer;
    }
    .ev-inner {
      position: relative;
      background: var(--bar-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transform-origin: 50% 100%;
      animation: ev-in .4s var(--bounce) both;
      transition: background-color .3s ease;
    }
    .ev-inner::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -7px;
      width: 14px;
      height: 14px;
      background: inherit;
      border-radius: 0 0 3px 0;
      transform: translateX(-50%) rotate(45deg);
      box-shadow: 3px 3px 6px rgba(0,0,0,.08);
    }
    .ev-card { width: 150px; }
    .ev-inner { isolation: isolate; }
    .ev-body {
      display: block; width: 100%; padding: 0; border: 0; border-radius: 16px;
      overflow: hidden; text-align: left; font: inherit; background: var(--bar-bg);
      color: var(--bar-text); cursor: pointer;
    }
    .ev-body img { display: block; width: 100%; height: 108px; object-fit: cover; }
    .ev-caption { display: block; padding: 7px 9px 9px; }
    .ev-caption strong, .ev-caption small {
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    }
    .ev-caption strong { font-size: 13px; line-height: 1.2; }
    .ev-caption small { margin-top: 3px; font-size: 11px; line-height: 1.25; }
    .ev-pager {
      position: absolute; top: 4px; right: 4px; display: flex; align-items: center;
      border-radius: 20px; background: #20232bea; color: white; font-size: 11px;
    }
    .ev-pager button { background: transparent; border: 0; color: inherit; width: 32px; height: 32px; font-size: 20px; cursor: pointer; }
    .ev-cluster { border: 2px solid white; border-radius: 24px; min-width: 40px; height: 40px;
      background: #503677; color: white; font: 700 14px system-ui; box-shadow: var(--shadow); cursor: pointer; }
    @keyframes ev-in {
      from { transform: scale(.5); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    /* Event detail page: slides up over the map */
    .ev-page {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--sheet-bg);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      transform: translateY(100%);
      visibility: hidden;
      transition: transform .5s var(--spring), visibility 0s linear .5s, background-color .3s ease;
    }
    .ev-page::-webkit-scrollbar { display: none; }
    .ev-page.open { transform: none; visibility: visible; transition: transform .5s var(--spring), visibility 0s, background-color .3s ease; }
    .ev-hero {
      position: relative;
      height: calc(env(safe-area-inset-top) + 260px);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 55%, #000));
    }
    .ev-hero::before, .ev-hero::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.13); }
    .ev-hero::before { width: 260px; height: 260px; right: -80px; top: -90px; }
    .ev-hero::after  { width: 150px; height: 150px; left: -40px; bottom: -60px; }
    .ev-hero > svg { position: relative; width: 84px; height: 84px; fill: none; stroke: rgba(255,255,255,.95); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-top: env(safe-area-inset-top); }
    .ev-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ev-back { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; z-index: 1; }
    .ev-content { padding: 20px 20px calc(env(safe-area-inset-bottom) + 28px); color: var(--bar-text); }
    .ev-cat { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
    .ev-content h1 { margin: 6px 0 18px; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
    .ev-rows { background: var(--row-bg); border-radius: 14px; padding: 4px 14px; margin-bottom: 24px; }
    .ev-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; font-size: 16px; }
    .ev-row svg { flex: none; width: 22px; height: 22px; fill: none; stroke: var(--icon); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .ev-row small { display: block; font-size: 13px; color: var(--bar-secondary); margin-top: 1px; }
    .ev-content h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
    .ev-content p { margin: 0 0 22px; font-size: 16px; line-height: 1.45; color: var(--bar-text); }
    .ev-map-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 14px;
      background: var(--user-blue);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
    .event-dialog {
      box-sizing: border-box;
      width: min(100%, 540px);
      max-height: 90vh;
      padding: 22px;
      border: 1px solid var(--hairline, #888);
      border-radius: 22px;
      background: var(--bar-bg);
      color: var(--bar-text);
    }
    .event-dialog::backdrop { background: rgb(0 0 0 / 55%); }
    .event-dialog header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .event-dialog h1 { margin: 0 0 12px; }
    .event-dialog button, .event-dialog label { min-height: 44px; }
    .event-dialog label { display: flex; align-items: center; gap: 10px; }
    .event-dialog input { width: 20px; height: 20px; }
    .event-dialog button {
      font: inherit;
      padding: 8px 14px;
      color: inherit;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 10px;
      cursor: pointer;
    }
    #evOrganizer { display: grid; place-items: center; margin-bottom: 10px; }
    .ev-map-btn:active { background: #0070e0; }

    .user-accuracy {
      border-radius: 50%;
      background: rgba(10,132,255,.12);
      border: 1px solid rgba(10,132,255,.25);
      pointer-events: none;
      transition: width .4s ease, height .4s ease;
    }
    .user-dot {
      width: 22px;
      height: 22px;
    }
    .user-dot::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: rgba(10,132,255,.22);
      animation: pulse 2.4s ease-out infinite;
    }
    .user-dot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--user-blue);
      border: 3.5px solid #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
    }
    @keyframes pulse {
      0%   { transform: scale(.4); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }
  </style>
</head>

  <script>
    // ---------- Theme helpers ----------
    const root = document.documentElement;
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const currentTheme = () => root.dataset.theme === 'dark' ? 'dark' : 'light';

    // ---------- Map ----------
    const STYLE_URL = 'https://vectortiles.geo.admin.ch/styles/ch.swisstopo.lightbasemap.vt/style.json';
    const CH_BOUNDS = [[5.7, 45.6], [10.7, 48.0]];
    const FALLBACK = [7.4474, 46.9480]; // Bern

    const map = new maplibregl.Map({
      container: 'map',
      // Plain background until the swisstopo style (light or dark) is ready
      style: { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': getComputedStyle(root).getPropertyValue('--page-bg').trim() } }] },
      center: FALLBACK,
      zoom: 13,
      minZoom: 7,
      maxBounds: CH_BOUNDS,
      attributionControl: false,
      pitchWithRotate: false,
    });

    // swisstopo has no dark vector basemap, so a dark variant is derived from the light style's colours.
    const STYLES = { light: null, dark: null };

    function parseColor(str) {
      if (typeof str !== 'string') return null;
      let m = str.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/i);
      if (m) {
        const r = m[1] / 255, g = m[2] / 255, b = m[3] / 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        const l = (max + min) / 2;
        let h = 0, s = 0;
        if (max !== min) {
          const d = max - min;
          s = l > .5 ? d / (2 - max - min) : d / (max + min);
          h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
          h *= 60;
        }
        return { h, s, l, a: m[4] === undefined ? 1 : +m[4] };
      }
      m = str.match(/^hsla?\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*(?:,\s*([\d.]+)\s*)?\)$/i);
      if (m) return { h: +m[1], s: m[2] / 100, l: m[3] / 100, a: m[4] === undefined ? 1 : +m[4] };
      return null;
    }
    const hsla = ({ h, s, l, a }) =>
      `hsla(${h.toFixed(1)}, ${(s * 100).toFixed(1)}%, ${(l * 100).toFixed(1)}%, ${a})`;

    function darkColor(c, layerId, prop) {
      let { h, s, l, a } = c;
      if (layerId === 'hillshade_grey') {
        // Base land + terrain shading: stay dark, shadows a touch darker
        return hsla({ h: 220, s: .1, l: .125 * l, a });
      }
      if (prop === 'text-halo-color') return hsla({ h: 220, s: .1, l: .1, a });
      if (prop === 'line-color' && layerId.includes('casing')) return hsla({ h: 220, s: .1, l: .08 + l * .05, a });
      if (prop === 'line-color' && l >= .9) {
        // White road fills → lighter grey than the ground
        return hsla({ h: 220, s: .08, l: .28 + (l - .9) * .6, a });
      }
      // Areas stay low-contrast; text and lines get more range so they stay readable
      const nl = .12 + (1 - l) * (prop === 'fill-color' ? .5 : .78);
      let ns = s * .6;
      if (s < .12) { h = 220; ns = .1; }
      return hsla({ h, s: ns, l: nl, a });
    }

    function mapColors(value, fn) {
      if (typeof value === 'string') { const c = parseColor(value); return c ? fn(c) : value; }
      if (Array.isArray(value)) return value.map((v) => mapColors(v, fn));
      if (value && typeof value === 'object') {
        const out = {};
        for (const k in value) out[k] = mapColors(value[k], fn);
        return out;
      }
      return value;
    }

    function makeDarkStyle(light) {
      const dark = structuredClone(light);
      for (const layer of dark.layers) {
        if (!layer.paint) continue;
        for (const prop in layer.paint) {
          if (!prop.endsWith('-color')) continue;
          layer.paint[prop] = mapColors(layer.paint[prop], (c) => darkColor(c, layer.id, prop));
        }
        if (layer.id === 'hillshade_yellow') layer.paint['fill-opacity'] = 0;
      }
      return dark;
    }

    // ---------- Community events ----------
    const preferencesKey = 'event-preferences';
    const preferencesPanel = document.getElementById('eventPreferences');
    const preferenceInputs = [...preferencesPanel.querySelectorAll('input')];
    try {
      const saved = JSON.parse(localStorage.getItem(preferencesKey));
      if (Array.isArray(saved)) {
        preferenceInputs.forEach((input) => { input.checked = saved.includes(input.value); });
      }
    } catch { /* Preferences still work for the current page. */ }

    const selectedPreferences = () => preferenceInputs.filter((input) => input.checked).map((input) => input.value);
    function visibleEvents() {
      const preferences = selectedPreferences();
      return EVENTS.features.filter((event) => EVENTS.matches(event, preferences));
    }

    const eventMarkers = [];
    let eventsOn = false;

    function updateCards() {
      for (const marker of eventMarkers) marker.remove();
      eventMarkers.length = 0;
      if (!eventsOn) return;

      const groups = [];
      for (const feature of visibleEvents()) {
        const coordinates = feature.geometry.coordinates;
        const point = map.project(coordinates);
        // Group venues in screen space. Zooming in separates nearby addresses.
        let group = groups.find((candidate) =>
          Math.abs(candidate.point.x - point.x) < 158 && Math.abs(candidate.point.y - point.y) < 180);
        if (!group) {
          group = { point, coordinates, features: [] };
          groups.push(group);
        }
        group.features.push(feature);
      }
      for (const { coordinates, features } of groups) {
        const bounds = new maplibregl.LngLatBounds();
        features.forEach((feature) => bounds.extend(feature.geometry.coordinates));
        const distinctVenues = bounds.getWest() !== bounds.getEast() || bounds.getNorth() !== bounds.getSouth();
        const cluster = distinctVenues && map.getZoom() < map.getMaxZoom() - 0.1;
        const element = cluster ? document.createElement('button') : makeVenueCard(features);
        if (cluster) {
          element.type = 'button';
          element.className = 'ev-cluster';
          element.textContent = features.length;
          element.setAttribute('aria-label', 'Zoom to ' + features.length + ' events near ' + features[0].properties.city);
          element.addEventListener('click', (e) => {
            e.stopPropagation();
            const nextZoom = Math.min(map.getMaxZoom(), map.getZoom() + 2);
            map.easeTo({ center: bounds.getCenter(), zoom: nextZoom });
          });
        }
        const marker = new maplibregl.Marker({ element, anchor: cluster ? 'center' : 'bottom' })
          .setLngLat(cluster ? bounds.getCenter() : coordinates).addTo(map);
        eventMarkers.push(marker);
      }
    }

    function makeVenueCard(features) {
      const card = document.createElement('div');
      card.className = 'ev-card';
      const inner = document.createElement('div');
      inner.className = 'ev-inner';
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ev-body';
      const photo = document.createElement('img');
      photo.loading = 'lazy';
      photo.alt = '';
      photo.addEventListener('error', () => {
        if (!photo.src.endsWith('/event-images/community.webp')) photo.src = 'event-images/community.webp';
      });
      const caption = document.createElement('span');
      caption.className = 'ev-caption';
      const title = document.createElement('strong');
      const time = document.createElement('small');
      caption.append(title, time);
      button.append(photo, caption);
      inner.append(button);
      card.append(inner);
      let index = 0;
      const count = document.createElement('span');
      function display() {
        const event = features[index].properties;
        photo.src = event.image;
        title.textContent = event.title;
        time.textContent = event.when;
        count.textContent = (index + 1) + '/' + features.length;
      }
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        openEvent(features[index].properties.id);
      });
      if (features.length > 1) {
        const pager = document.createElement('div');
        pager.className = 'ev-pager';
        pager.setAttribute('aria-live', 'polite');
        for (const step of [-1, 1]) {
          const nav = document.createElement('button');
          nav.type = 'button';
          nav.textContent = step < 0 ? '‹' : '›';
          nav.setAttribute('aria-label', step < 0 ? 'Previous event at this venue' : 'Next event at this venue');
          nav.addEventListener('click', (e) => {
            e.stopPropagation();
            index = (index + step + features.length) % features.length;
            display();
          });
          if (step === 1) pager.append(count);
          pager.append(nav);
        }
        inner.append(pager);
      }
      display();
      return card;
    }
    map.on('zoomend', updateCards);
    map.on('rotateend', updateCards);
    map.on('resize', updateCards);

    function setEventsOn(enabled) {
      eventsOn = enabled;
      eventsBtn.setAttribute('aria-pressed', String(enabled));
      eventsBtn.classList.toggle('active', enabled);
      updateCards();
    }

    function applyMapTheme(diff) {
      const theme = currentTheme();
      if (!STYLES[theme]) return;
      const style = structuredClone(STYLES[theme]);
      style.sources.platforms = { type: 'geojson', data: PLATFORM_FC };
      style.sources.route = { type: 'geojson', data: ROUTE_FC };
      style.layers.push(...platformLayers(theme), ...routeLayers(theme));
      map.setStyle(style, { diff });
    }

    fetch(STYLE_URL)
      .then((r) => r.json())
      .then((style) => {
        STYLES.light = style;
        STYLES.dark = makeDarkStyle(style);
        applyMapTheme(false);
        map.once('idle', updateCards);
      })
      .catch(() => showToast('Map could not be loaded'));

    function setTheme(theme, persist) {
      root.dataset.theme = theme;
      themeMeta.setAttribute('content', getComputedStyle(root).getPropertyValue('--page-bg').trim());
      if (persist) { try { localStorage.setItem('theme', theme); } catch (e) {} }
      applyMapTheme(true);
    }
    themeMeta.setAttribute('content', getComputedStyle(root).getPropertyValue('--page-bg').trim());

    // Follow the system setting until the user picks a theme themselves
    if (window.matchMedia) {
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
        let saved = null;
        try { saved = localStorage.getItem('theme'); } catch (err) {}
        if (!saved) setTheme(e.matches ? 'dark' : 'light', false);
      });
    }

    // ---------- Toast ----------
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(text, ms = 4000) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
    }

    // ---------- Top-right menu ----------
    const menu = document.getElementById('menu');
    const menuBtn = document.getElementById('menuBtn');
    const menuItems = menu.querySelectorAll('.menu-item');
    function setMenu(open) {
      menu.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', String(open));
      menuItems.forEach((b) => (b.tabIndex = open ? 0 : -1));
    }
    menuBtn.addEventListener('click', () => setMenu(!menu.classList.contains('open')));
    document.getElementById('themeBtn').addEventListener('click', () =>
      setTheme(currentTheme() === 'dark' ? 'light' : 'dark', true));
    const eventsBtn = document.getElementById('eventsBtn');
    const settingsPage = document.getElementById('settingsPage');
    eventsBtn.addEventListener('click', () => {
      setEventsOn(!eventsOn);
      setMenu(false);
      menuBtn.focus();
      if (!eventsOn) return;
      const events = visibleEvents();
      if (!events.length) {
        showToast('No events match your preferences.');
        return;
      }
      const bounds = new maplibregl.LngLatBounds();
      events.forEach((event) => bounds.extend(event.geometry.coordinates));
      const { clientHeight, clientWidth } = map.getContainer();
      map.fitBounds(bounds, {
        padding: {
          top: Math.min(165, clientHeight / 3), bottom: Math.min(100, clientHeight / 4),
          left: Math.min(72, clientWidth / 4), right: Math.min(72, clientWidth / 4),
        },
        maxZoom: 15, duration: 600,
      });
    });
    document.getElementById('settingsBtn').addEventListener('click', () => {
      setMenu(false);
      settingsPage.showModal();
    });
    settingsPage.addEventListener('close', () => menuBtn.focus());
    preferencesPanel.addEventListener('change', () => {
      try { localStorage.setItem(preferencesKey, JSON.stringify(selectedPreferences())); }
      catch { /* Preferences still work for the current page. */ }
      updateCards();
    });

    // ---------- Current location ----------
    const accEl = document.createElement('div');
    accEl.className = 'user-accuracy';
    const accMarker = new maplibregl.Marker({ element: accEl });
    const dotEl = document.createElement('div');
    dotEl.className = 'user-dot';
    const userMarker = new maplibregl.Marker({ element: dotEl });
    let userLngLat = null;
    let userAccuracy = 0;
    let centeredOnUser = false;

    const inSwitzerland = ([lng, lat]) =>
      lng >= CH_BOUNDS[0][0] && lng <= CH_BOUNDS[1][0] &&
      lat >= CH_BOUNDS[0][1] && lat <= CH_BOUNDS[1][1];

    // Size the light-blue accuracy halo in metres, like Apple Maps
    function updateAccuracy() {
      if (!userLngLat) return;
      const mPerPx = 40075016.686 * Math.cos(userLngLat[1] * Math.PI / 180) / (512 * 2 ** map.getZoom());
      const d = Math.min(2 * userAccuracy / mPerPx, 4000);
      accEl.style.width = accEl.style.height = d + 'px';
      accEl.style.display = d < 40 ? 'none' : '';
    }
    map.on('zoom', updateAccuracy);

    function onPosition(pos) {
      const lngLat = [pos.coords.longitude, pos.coords.latitude];
      if (!inSwitzerland(lngLat)) {
        showToast('You are outside Switzerland');
        return;
      }
      userLngLat = lngLat;
      userAccuracy = pos.coords.accuracy || 0;
      accMarker.setLngLat(lngLat);
      userMarker.setLngLat(lngLat);
      if (!userMarker._map) { accMarker.addTo(map); userMarker.addTo(map); }
      updateAccuracy();
      if (!centeredOnUser && !destMarker._map) {
        centeredOnUser = true;
        map.jumpTo({ center: lngLat, zoom: 15 });
      }
    }

    function onPositionError(err) {
      if (userLngLat) return; // keep the last known position
      const msg = err.code === 1
        ? 'Location access is off. Allow it in Settings › Safari › Location.'
        : 'Your location could not be found.';
      showToast(msg, 6000);
    }

    if (!window.isSecureContext) {
      showToast('Location needs HTTPS. Open the app via https:// or localhost.', 8000);
    } else if (!('geolocation' in navigator)) {
      showToast('This browser does not support location.');
    } else {
      // Quick coarse fix first, then precise live updates
      navigator.geolocation.getCurrentPosition(onPosition, () => {}, { enableHighAccuracy: false, maximumAge: 60000, timeout: 5000 });
      navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    }

    // ---------- Search (swisstopo SearchServer) ----------
    const wrap = document.getElementById('searchWrap');
    const form = document.getElementById('searchForm');
    const input = document.getElementById('q');
    const list = document.getElementById('results');
    const clearBtn = document.getElementById('clear');
    const destMarker = new maplibregl.Marker({ color: '#ff3b30' });

    const ZOOM_BY_ORIGIN = { address: 17, gazetteer: 15, zipcode: 13, gg25: 13 };
    // Result kinds → icon + colour (Apple Maps style: white glyph on a coloured circle)
    const KIND = {
      address:  { color: '#ff3b30', svg: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>' },
      city:     { color: '#5e5ce6', svg: '<path d="M3 21h18M5 21V11l5-3v13M10 21V5l9 4v12M14 10h2M14 14h2M14 18h2"/>' },
      postcode: { color: '#5e5ce6', svg: '<path d="M4 6h16v12H4zM4 7l8 6 8-6"/>' },
      mountain: { color: '#a2845e', svg: '<path d="M2.5 19.5l6.5-12 4 7 2.5-3.5 6 8.5z"/>' },
      water:    { color: '#32ade6', svg: '<path d="M3 9.5c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 15.5c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>' },
      building: { color: '#8e8e93', svg: '<path d="M5 21V4h14v17M3 21h18M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/>' },
      station:  { color: '#0a84ff', svg: '<path d="M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 10h16M8 17l-2 4M16 17l2 4"/>' },
      nature:   { color: '#34c759', svg: '<path d="M12 3l6 8.5h-3.5L19 17H5l4.5-5.5H6zM12 17v4"/>' },
      other:    { color: '#8e8e93', svg: '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>' },
    };
    const CANTONS = { AG: 'Aargau', AI: 'Appenzell I.Rh.', AR: 'Appenzell A.Rh.', BE: 'Bern', BL: 'Basel-Landschaft', BS: 'Basel-Stadt',
      FR: 'Fribourg', GE: 'Geneva', GL: 'Glarus', GR: 'Graubünden', JU: 'Jura', LU: 'Lucerne', NE: 'Neuchâtel', NW: 'Nidwalden',
      OW: 'Obwalden', SG: 'St. Gallen', SH: 'Schaffhausen', SO: 'Solothurn', SZ: 'Schwyz', TG: 'Thurgau', TI: 'Ticino', UR: 'Uri',
      VD: 'Vaud', VS: 'Valais', ZG: 'Zug', ZH: 'Zurich' };
    const cantonName = (c) => CANTONS[c] || c || '';

    function gazetteerKind(type, oc) {
      const t = type.toLowerCase();
      if (/local name|field name/.test(t)) return ['nature', 'Area'];
      if (/SIEDLUNG/.test(oc) || /populated|settlement|place|quarter|district/.test(t)) return ['city', 'Place'];
      if (/GEWAESSER/.test(oc) || /lake|pond|reservoir/.test(t)) return ['water', /river|stream|brook/.test(t) ? 'River' : 'Lake'];
      if (/river|stream|brook|waterfall/.test(t)) return ['water', type];
      if (/peak|summit|mountain|hill|pass|viewpoint|ridge|rock|glacier/.test(t)) return ['mountain', type];
      if (/\bstation\b|\bstop\b/.test(t)) return ['station', type];
      if (/forest|wood|park|meadow|nature/.test(t)) return ['nature', type];
      if (/GEBAEUDE/.test(oc) || /building/.test(t)) return ['building', 'Building'];
      return ['other', type];
    }

    // swisstopo labels → a short main name + a grey detail line
    function parseResult(attrs) {
      const label = attrs.label || '';
      const bold = stripTags((label.match(/<b>(.*?)<\/b>/i) || [])[1] || '');
      const italic = stripTags((label.match(/<i>(.*?)<\/i>/i) || [])[1] || '').replace(/\s+/g, ' ').trim();
      const canton = ((label.match(/\(([A-Z]{2})\)/) || [])[1]) || '';
      switch (attrs.origin) {
        case 'address': {
          const street = stripTags(label.replace(/<b>.*?<\/b>/i, '')).replace(/\s*#\s*$/, '');
          return { title: street || bold, subtitle: bold, kind: 'address' };
        }
        case 'gg25':
          return { title: bold.replace(/\s*\([A-Z]{2}\)\s*$/, ''), subtitle: ['Municipality', cantonName(canton)].filter(Boolean).join(' · '), kind: 'city' };
        case 'zipcode': {
          const [, zip, name] = bold.match(/^(\d{4})\s*-\s*(.+)$/) || [null, '', bold];
          return { title: name, subtitle: `Postcode ${zip}`.trim(), kind: 'postcode' };
        }
        default: { // gazetteer: "<i>Type</i> <b>Name</b> (BE) - Municipality,Municipality,…"
          const munis = (stripTags(label).split(' - ')[1] || '').split(',').map((x) => x.trim()).filter(Boolean);
          const [kind, typeLabel] = gazetteerKind(italic, attrs.objectclass || '');
          let where = munis[0] && munis[0] !== bold ? munis[0] + (munis.length > 1 ? ` +${munis.length - 1}` : '') : '';
          where = [where, cantonName(canton)].filter(Boolean).join(', ');
          return { title: bold, subtitle: [typeLabel, where].filter(Boolean).join(' · '), kind };
        }
      }
    }

    const COLLAPSED_COUNT = 3;
    let results = [];
    let expanded = false;
    let debounce;
    let reqId = 0;

    const stripTags = (s) => s.replace(/<[^>]*>/g, '').trim();

    async function search(text) {
      const id = ++reqId;
      const url = 'https://api3.geo.admin.ch/rest/services/api/SearchServer?' + new URLSearchParams({
        searchText: text,
        type: 'locations',
        origins: 'zipcode,gg25,gazetteer,address',
        sr: '4326',
        limit: '15',
        lang: 'en',
      });
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (id !== reqId) return; // a newer query is in flight
        const seen = new Set();
        results = (data.results || []).map((r) => ({
          ...parseResult(r.attrs),
          origin: r.attrs.origin,
          lngLat: [r.attrs.lon, r.attrs.lat],
        })).filter((r) => {
          const key = (r.title + '|' + r.subtitle).toLowerCase();
          if (!r.title || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        expanded = false;
        render();
      } catch (e) {
        if (id === reqId) { results = []; render('Search unavailable'); }
      }
    }

    function render(emptyText = 'No results') {
      list.innerHTML = '';
      if (!input.value.trim()) { list.classList.remove('open'); return; }
      if (!results.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = emptyText;
        list.appendChild(li);
      }
      const visible = expanded ? results : results.slice(0, COLLAPSED_COUNT);
      visible.forEach((r, i) => {
        const li = document.createElement('li');
        li.setAttribute('role', 'option');
        const icon = document.createElement('div');
        const k = KIND[r.kind] || KIND.other;
        icon.className = 'icon';
        icon.style.background = k.color;
        icon.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${k.svg}</svg>`;
        const text = document.createElement('div');
        text.className = 'text';
        const t = document.createElement('div');
        t.className = 'title';
        t.textContent = r.title;
        const s = document.createElement('div');
        s.className = 'subtitle';
        s.textContent = r.subtitle;
        text.append(t, s);
        li.append(icon, text);
        // pointerdown + preventDefault keeps focus so the list doesn't vanish before the tap registers
        li.addEventListener('pointerdown', (e) => e.preventDefault());
        li.addEventListener('click', () => select(i));
        list.appendChild(li);
      });
      if (!expanded && results.length > COLLAPSED_COUNT) {
        const more = document.createElement('li');
        more.className = 'more';
        more.textContent = 'Show more…';
        more.addEventListener('pointerdown', (e) => e.preventDefault());
        more.addEventListener('click', () => { expanded = true; render(); });
        list.appendChild(more);
      }
      list.classList.add('open');
      if (!expanded) list.scrollTop = 0;
    }

    function select(i) {
      const r = results[i];
      if (!r) return;
      input.value = r.title;
      clearBtn.classList.add('show');
      list.classList.remove('open');
      input.blur();
      destMarker.setLngLat(r.lngLat).addTo(map);
      startJourney(r);
    }

    input.addEventListener('input', () => {
      const text = input.value.trim();
      clearBtn.classList.toggle('show', !!input.value);
      clearTimeout(debounce);
      if (text.length < 2) { reqId++; results = []; render(); return; }
      debounce = setTimeout(() => search(text), 200);
    });

    input.addEventListener('focus', () => { setMenu(false); if (input.value.trim()) render(); });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (results.length) select(0);
    });

    clearBtn.addEventListener('pointerdown', (e) => e.preventDefault());
    clearBtn.addEventListener('click', () => {
      input.value = '';
      results = [];
      reqId++;
      clearBtn.classList.remove('show');
      render();
      destMarker.remove();
      if (userLngLat) map.flyTo({ center: userLngLat, zoom: 15 });
      input.focus();
    });

    // Collapse the bar into a circle when the user moves the map; tap the circle to expand it again
    map.on('movestart', (e) => {
      if (!e.originalEvent) return; // ignore programmatic moves (flyTo after a search)
      if (wrap.classList.contains('journey-open')) { setMenu(false); return; } // keep the journey widget open
      input.blur();
      setMenu(false);
      wrap.classList.add('collapsed');
    });
    form.addEventListener('click', () => {
      if (!wrap.classList.contains('collapsed')) return;
      wrap.classList.remove('collapsed');
      input.focus();
    });

    // Tapping the map closes the keyboard, results and menu
    map.on('mousedown', () => { input.blur(); setMenu(false); });
    map.on('touchstart', () => { input.blur(); setMenu(false); });
    input.addEventListener('blur', () => list.classList.remove('open'));

    // ---------- Platforms & stop edges ----------
    // Exact position of every platform (Gleis) and bus/tram stop edge (Kante) in Switzerland, from the
    // official ATLAS data (platforms.js, built by tools/build_platforms.py). Always drawn on the map from
    // zoom 17, and used to put journey boarding/alighting points on the right platform.
    const PLATFORM_FC = { type: 'FeatureCollection', features: [] };
    const PLATFORMS = new Map(); // station id (UIC, as in transport.opendata.ch) → { name, mode, edges: [{ ref, key, bearing, ll }] }
    const PLATFORM_MODES = { t: 'train', m: 'tram', b: 'bus', s: 'boat', c: 'cable' };

    // Comparable platform name: "7A-D" → "7", "Kante H" → "H", "K1" → "K1", "–" → ""
    function platformKey(p) {
      const s = String(p || '').toUpperCase().replace(/^(GLEIS|GL\.|KANTE|QUAI|VOIE|BINARIO|STEG|PERRON)\s*/, '').trim();
      const digits = /^\d+/.exec(s);
      return digits ? digits[0] : s.replace(/[^0-9A-Z]/g, '');
    }

    function indexPlatforms(data) {
      if (!data || !data.stops) return;
      const features = [];
      for (const [id, [name, m, raw]] of Object.entries(data.stops)) {
        const mode = PLATFORM_MODES[m] || 'bus';
        const edges = raw.map(([x, y, ref = '', bearing = null, level = null]) =>
          ({ ref: ref || '', key: platformKey(ref), bearing, level, ll: [x / 1e5, y / 1e5] }));
        PLATFORMS.set(id, { name, mode, edges });
        edges.forEach((e, i) => {
          features.push({ type: 'Feature', properties: { id, i, ref: e.ref }, geometry: { type: 'Point', coordinates: e.ll } });
        });
      }
      PLATFORM_FC.features = features;
      const src = map.getSource('platforms');
      if (src) src.setData(PLATFORM_FC);
      delete window.PLATFORM_DATA;
    }

    // Loaded after start-up (it is ~2 MB), as a script so it also works when index.html is opened as a file
    const platformsReady = new Promise((resolve) => {
      const s = document.createElement('script');
      s.src = 'platforms.js';
      s.async = true;
      s.onload = () => { indexPlatforms(window.PLATFORM_DATA); resolve(); };
      s.onerror = () => resolve(); // journeys fall back to station positions
      document.head.appendChild(s);
    });

    // Neutral white dots that only appear when zoomed in close (street level)
    const PLATFORM_MIN_ZOOM = 17;
    const PLATFORM_TEXT_NUDGE = 0.135; // em down: the font sits high in its line box (measured)
    function platformLayers(theme) {
      const labelled = ['!=', ['get', 'ref'], ''];
      const fadeIn = ['interpolate', ['linear'], ['zoom'], PLATFORM_MIN_ZOOM, 0, PLATFORM_MIN_ZOOM + 0.4, 1];
      return [
        { id: 'platform-dot', type: 'circle', source: 'platforms', minzoom: PLATFORM_MIN_ZOOM,
          paint: {
            'circle-color': '#ffffff',
            'circle-radius': ['interpolate', ['linear'], ['zoom'], PLATFORM_MIN_ZOOM, ['case', labelled, 7, 4], 19, ['case', labelled, 11, 6]],
            'circle-opacity': fadeIn,
          } },
        // Platform / edge name inside the dot ("7", "H"); in crowded stations some only appear when zooming in further
        { id: 'platform-ref', type: 'symbol', source: 'platforms', minzoom: PLATFORM_MIN_ZOOM, filter: labelled,
          layout: {
            'text-field': ['get', 'ref'],
            'text-font': ['Frutiger Neue Bold'],
            'text-size': ['interpolate', ['linear'], ['zoom'], PLATFORM_MIN_ZOOM, 10, 19, 14],
            'text-offset': [0, PLATFORM_TEXT_NUDGE], // the font sits a little off-centre in its line box
            'text-padding': 0,
            'text-ignore-placement': true,
          },
          // a halo in the text colour makes the strokes heavier than the font's own bold
          paint: { 'text-color': '#1c1c1e', 'text-halo-color': '#1c1c1e', 'text-halo-width': 0.6, 'text-opacity': fadeIn } },
      ];
    }

    // Tap a platform: its name and the next departures from exactly that platform / edge (live)
    const platformPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'pf-pop', maxWidth: 'none', offset: 16 });
    let popupReq = 0;
    // Forgiving tap: the nearest dot within ~16 px, so small dots are easy to hit on a phone
    map.on('click', (e) => {
      const r = 16;
      const hits = map.getLayer('platform-dot')
        ? map.queryRenderedFeatures([[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]], { layers: ['platform-dot'] }) : [];
      if (!hits.length) { popupReq++; platformPopup.remove(); return; }
      const dist = (f) => map.project(f.geometry.coordinates).dist(e.point);
      openPlatform(hits.reduce((a, b) => (dist(b) < dist(a) ? b : a)));
    });
    async function openPlatform(f) {
      const st = PLATFORMS.get(String(f.properties.id));
      const edge = st && st.edges[f.properties.i];
      if (!edge) return;
      const req = ++popupReq;
      const word = edge.ref ? nounOf(st.mode) : 'Stop';
      const dot = mk('span', 'pf-dot', edge.ref);
      const name = mk('div', 'pf-name');
      const kind = (edge.ref ? `${word} ${edge.ref}` : word) + (edge.level ? ` · Level ${levelShort(edge.level)}` : '');
      name.append(mk('b', null, st.name), mk('small', null, kind));
      const head = mk('div', 'pf-head');
      head.append(dot, name);
      const note = mk('p', 'pf-note', 'Loading departures…');
      const list = mk('ul', 'pf-list');
      const box = mk('div');
      box.append(head, note, list);
      platformPopup.setLngLat(edge.ll).setDOMContent(box).addTo(map);
      try {
        const res = await fetch(`${OPENDATA}stationboard?` + new URLSearchParams({ id: f.properties.id, limit: '40' }));
        const all = ((await res.json()).stationboard || []).filter((d) => d.stop && d.stop.departure);
        if (req !== popupReq) return;
        // a departure leaves from this edge if it is where we would board it (same rule as for journeys)
        const here = all.filter((d) => platformLL(d.stop, null, d.passList && d.passList[1] ? coordOf(d.passList[1]) : null) === edge.ll);
        note.textContent = !all.length ? 'No departures in the next hours.' : here.length ? '' : `All departures from ${st.name}:`;
        list.replaceChildren(...(here.length ? here : all).slice(0, 6).map((d) => {
          const li = mk('li');
          li.append(mk('time', null, fmtTime(d.stop.prognosis && d.stop.prognosis.departure || d.stop.departure)), badge(d), mk('span', 'pf-to', d.to));
          if (d.stop.delay > 0) li.append(mk('span', 'j-delay', `+${d.stop.delay}′`));
          return li;
        }));
        platformPopup.setLngLat(edge.ll); // re-fit now that the card is taller
      } catch {
        if (req === popupReq) note.textContent = 'Departures could not be loaded.';
      }
    }
    map.on('mouseenter', 'platform-dot', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'platform-dot', () => { map.getCanvas().style.cursor = ''; });

    function bearingDeg(a, b) {
      const toRad = Math.PI / 180;
      const dLng = (b[0] - a[0]) * toRad;
      const y = Math.sin(dLng) * Math.cos(b[1] * toRad);
      const x = Math.cos(a[1] * toRad) * Math.sin(b[1] * toRad) - Math.sin(a[1] * toRad) * Math.cos(b[1] * toRad) * Math.cos(dLng);
      return (Math.atan2(y, x) / toRad + 360) % 360;
    }
    const angleDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

    // Exact place to board/alight at a stop: the platform the timetable names; without one, the edge
    // where vehicles going our way (prev → next) stop; otherwise the station's own position.
    const platformLL = (stop, prev, next) => platformAt(stop, prev, next).ll;
    // → { ll, edge (null = only the station is known), travel (bearing of travel or null) }
    function platformAt(stop, prev, next) {
      const base = coordOf(stop);
      const st = stop && stop.station && PLATFORMS.get(String(stop.station.id));
      const out = (e) => ({ ll: e ? e.ll : base, edge: e || null, travel });
      let travel = null;
      if (!st) return out(null);
      const here = base || st.edges[0].ll;
      const from = prev || here, to = next || here;
      travel = distKm(from, to) >= 0.01 ? bearingDeg(from, to) : null;
      // ATLAS compass direction = direction of travel of the vehicles stopping at that edge
      const facing = (edges) => {
        const withBearing = travel == null ? [] : edges.filter((e) => e.bearing != null);
        if (!withBearing.length) return null;
        const best = withBearing.reduce((a, b) => (angleDiff(b.bearing, travel) < angleDiff(a.bearing, travel) ? b : a));
        return angleDiff(best.bearing, travel) <= 60 ? best : null;
      };
      const key = platformKey(platformOf(stop));
      if (key) {
        const hits = st.edges.filter((e) => e.key === key);
        if (hits.length) return out(hits.length > 1 && facing(hits) || hits[0]); // e.g. one "A" per direction
      }
      const pool = key ? st.edges.filter((e) => !e.key) : st.edges; // unknown name: only unnamed edges qualify
      if (pool.length <= 1) return out(pool[0]);
      if (travel == null) return out(null);
      const best = facing(pool);
      if (best) return out(best);
      if (pool.length > 2) return out(null); // e.g. a big station without platform information: don't guess
      // Two edges: traffic keeps right, so take the one on the right of the direction of travel
      const c = pool.reduce((s, e) => [s[0] + e.ll[0] / pool.length, s[1] + e.ll[1] / pool.length], [0, 0]);
      const k = Math.cos(c[1] * Math.PI / 180);
      const dx = Math.sin(travel * Math.PI / 180), dy = Math.cos(travel * Math.PI / 180);
      const side = (e) => dx * (e.ll[1] - c[1]) - dy * (e.ll[0] - c[0]) * k; // < 0: right of travel
      return out(pool.reduce((a, b) => (side(b) < side(a) ? b : a)));
    }

    // ---------- Journey (public transport via transport.opendata.ch) ----------
    const ROUTE_FC = { type: 'FeatureCollection', features: [] };
    let journeyStep = 0;
    let journeySteps = [];
    let journeyReq = 0;
    const journeyEl = document.getElementById('journey');
    const jStrip = document.getElementById('jStrip');
    const jList = document.getElementById('jList');
    const jStatus = document.getElementById('jStatus');
    let journeyConn = null;
    let journeyDest = null;
    let journeyQuery = { mode: 'dep', date: '', time: '' }; // empty date/time = now
    let progressTimer = null;

    const ROUTE_BLUE = '#0a6cff';
    const routeColor = (theme) => ['case', ['==', ['get', 'done'], true], theme === 'dark' ? '#2fa84f' : '#34c759', ROUTE_BLUE];
    const stepOpacity = (dim) => ['case', ['==', ['get', 'step'], journeyStep], 1, dim];

    function routeLayers(theme) {
      const bg = theme === 'dark' ? '#1c1f24' : '#ffffff';
      return [
        { id: 'route-casing', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'ride'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': bg, 'line-width': 10, 'line-opacity': stepOpacity(.6) } },
        { id: 'route-ride', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'ride'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': routeColor(theme), 'line-width': 6, 'line-opacity': stepOpacity(.4) } },
        { id: 'route-walk', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'walk'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': routeColor(theme), 'line-width': 5, 'line-dasharray': [0, 1.8], 'line-opacity': stepOpacity(.4) } },
        { id: 'route-stops', type: 'circle', source: 'route', filter: ['==', ['get', 'kind'], 'stop'],
          paint: { 'circle-radius': 5.5, 'circle-color': bg, 'circle-stroke-color': routeColor(theme), 'circle-stroke-width': 3,
                   'circle-opacity': stepOpacity(.6), 'circle-stroke-opacity': stepOpacity(.5) } },
        // "Platform 7" / "Stop H" next to where to board or get off, for the step shown in the card
        { id: 'route-label', type: 'symbol', source: 'route', filter: ['all', ['==', ['get', 'kind'], 'stop'], ['!=', ['get', 'label'], '']],
          layout: { 'text-field': ['get', 'label'], 'text-font': ['Frutiger Neue Condensed Bold'], 'text-size': 14,
                    'text-anchor': 'left', 'text-offset': [0.9, 0], 'text-allow-overlap': true, 'text-ignore-placement': true },
          paint: { 'text-color': theme === 'dark' ? '#ffffff' : '#1c1c1e', 'text-halo-color': bg, 'text-halo-width': 2,
                   'text-opacity': stepOpacity(0) } },
      ];
    }

    function refreshRouteHighlight() {
      if (!map.getLayer('route-ride')) return;
      map.setPaintProperty('route-casing', 'line-opacity', stepOpacity(.6));
      map.setPaintProperty('route-ride', 'line-opacity', stepOpacity(.4));
      map.setPaintProperty('route-walk', 'line-opacity', stepOpacity(.4));
      map.setPaintProperty('route-stops', 'circle-opacity', stepOpacity(.6));
      map.setPaintProperty('route-stops', 'circle-stroke-opacity', stepOpacity(.5));
      map.setPaintProperty('route-label', 'text-opacity', stepOpacity(0));
    }

    function setRoute(features) {
      ROUTE_FC.features = features;
      const src = map.getSource('route');
      if (src) src.setData(ROUTE_FC);
    }

    const MODE_ICON = {
      train: '<path d="M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 10h16M8 17l-2 4M16 17l2 4"/>',
      tram:  '<path d="M7 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM9 2.5h6M12 2.5V6M5 12h14M8 18l-2 3M16 18l2 3"/>',
      bus:   '<path d="M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 17v3M17 17v3"/>',
      boat:  '<path d="M3 15l2 5h14l2-5zM6 15V9h12v6M12 5v4"/>',
      cable: '<path d="M3 4l18 4M12 6v4M7 10h10v8H7zM7 14h10"/>',
      walk:  '<circle cx="13" cy="4.2" r="1.9"/><path d="M10.5 21l1.5-5.5 2.5 2.5v3M8.5 12.5l2.5-4.5 3 1 2 3.5M12 15.5l-1.2-6.5"/>',
      pin:   '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
      change: '<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>',
      arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
      up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
      chevron: '<path d="M9 6l6 6-6 6"/>',
      check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
      left: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/>',
      right: '<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0-6 6v5"/>',
      straight: '<path d="M12 20V4M6 10l6-6 6 6"/>',
      stairs: '<path d="M4 20h5v-5h5v-5h5V5"/>',
    };
    const MODE_COLOR = { train: '#eb0000', tram: '#0a84ff', bus: '#3c3c8c', boat: '#00a3c4', cable: '#8e8e93' };
    const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${MODE_ICON[name]}</svg>`;

    function modeOf(category = '') {
      const c = category.toUpperCase();
      if (/^(IC|ICE|ICN|IR|IRE|EC|EN|EXT|NJ|RE|R|RB|S|SN|PE|TGV|RJX|TER)$/.test(c)) return 'train';
      if (/^(T|TRAM|M)$/.test(c)) return 'tram';
      if (/^(BAT|FAE|BAV)$/.test(c)) return 'boat';
      if (/^(FUN|PB|GB|SL|LB|ASC)$/.test(c)) return 'cable';
      return 'bus';
    }
    function lineLabel(j) {
      const c = (j.category || '').toUpperCase();
      const n = j.number || '';
      if (!n) return c;
      if (/^(S|SN|R|RE|IR|IC|EC|ICE)$/.test(c)) return /^(S|SN)$/.test(c) ? c + n : `${c} ${n}`;
      if (c === 'B' || c === 'T' || c === 'BUS' || c === 'TRAM') return n;
      return `${c} ${n}`;
    }

    const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    function fmtDuration(d) {
      const m = /(\d+)d(\d+):(\d+)/.exec(d || '');
      if (!m) return '';
      const h = +m[1] * 24 + +m[2], min = +m[3];
      return h ? `${h} h ${min} min` : `${min} min`;
    }
    function dayLabel(iso) {
      const d = new Date(iso), now = new Date();
      const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
      if (d.toDateString() === now.toDateString()) return 'Today';
      if (d.toDateString() === tomorrow.toDateString()) return 'Tomorrow';
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    const coordOf = (stop) => {
      const c = stop && (stop.station || stop.location) && (stop.station || stop.location).coordinate;
      return c && c.x != null && c.y != null ? [c.y, c.x] : null; // API: x = lat, y = lng
    };

    const sameStop = (a, b) => !!(a && b && a.station && b.station && a.station.id && a.station.id === b.station.id);
    const platformLabel = (stop, j) => { const p = platformOf(stop); return p === '–' ? '' : `${platformWord(j)} ${p}`; };

    // Every stop of a ride on its exact platform/edge (falls back to the station position)
    function placeRide(s) {
      const list = s.journey.passList;
      const raw = list.map(coordOf);
      const at = list.map((stop, k) =>
        platformAt(k === 0 ? s.departure : k === list.length - 1 ? s.arrival : stop, raw[k - 1] || null, raw[k + 1] || null));
      const pts = at.map((a) => a.ll);
      return { path: pts.filter(Boolean), dep: pts[0] || coordOf(s.departure), arr: pts[pts.length - 1] || coordOf(s.arrival),
        depAt: at[0], arrAt: at[at.length - 1] };
    }

    // Turn the API's sections into swipeable steps: walk → ride → change → ride → … → walk → arrive
    function buildSteps(conn, destTitle) {
      const steps = [];
      let walk = { min: 0, lines: [], start: null };
      let lastRide = null;
      const flushWalk = () => { const w = walk; walk = { min: 0, lines: [], start: null }; return w; };
      const at = new Map(conn.sections.filter((s) => s.journey).map((s) => [s, placeRide(s)]));
      conn.sections.forEach((s, idx) => {
        if (!s.journey) {
          walk.min += Math.round((s.walk && s.walk.duration || 0) / 60);
          walk.start = walk.start || s.departure.departure;
          // walks start/end on the platform you get off / on, not at the station's centre
          let a = coordOf(s.departure), b = coordOf(s.arrival);
          if (lastRide && sameStop(s.departure, lastRide.arrival)) a = at.get(lastRide).arr || a;
          const nextRide = conn.sections.slice(idx + 1).find((x) => x.journey);
          if (nextRide && sameStop(s.arrival, nextRide.departure)) b = at.get(nextRide).dep || b;
          if (a && b) walk.lines.push([a, b]);
          return;
        }
        const w = flushWalk();
        const here = at.get(s);
        if (!lastRide) {
          if (w.min > 0) {
            const t0 = new Date(w.start || conn.from.departure).getTime();
            steps.push({ type: 'walk', min: w.min, lines: w.lines, start: w.start, toName: s.departure.station.name, next: s,
              board: here.dep, t0, t1: t0 + w.min * 60000 });
          }
        } else {
          const t0 = new Date(lastRide.arrival.arrival).getTime();
          const pa = at.get(lastRide).arr, pd = here.dep;
          // changing platforms inside a station: show the way from one platform to the other
          const lines = w.lines.length ? w.lines : pa && pd && distKm(pa, pd) > 0.015 ? [[pa, pd]] : [];
          steps.push({ type: 'change', prev: lastRide, next: s, walkMin: w.min, lines,
            points: [pa, pd], t0, t1: w.min > 0 ? t0 + w.min * 60000 : new Date(s.departure.departure).getTime() });
        }
        steps.push({ type: 'ride', s, path: here.path, depAt: here.depAt, arrAt: here.arrAt,
          t0: new Date(s.departure.departure).getTime(), t1: new Date(s.arrival.arrival).getTime() });
        lastRide = s;
      });
      const w = flushWalk();
      const end = lastRide ? at.get(lastRide).arr : null;
      if (w.min > 0 || !lastRide) {
        const t0 = new Date(w.start || (lastRide ? lastRide.arrival.arrival : conn.from.departure)).getTime();
        steps.push({ type: 'walk', min: w.min, lines: w.lines, start: w.start, toName: destTitle, final: true,
          from: lastRide, alight: end, t0, t1: t0 + w.min * 60000 });
      }
      steps.push({ type: 'arrive', destTitle, time: conn.to.arrival, from: lastRide, end });
      return steps;
    }

    function stepCoords(st) {
      const c = [];
      (st.lines || []).forEach((l) => c.push(...l));
      if (st.path) c.push(...st.path);
      if (st.points) c.push(...st.points.filter(Boolean));
      if (st.board) c.push(st.board);
      if (st.alight) c.push(st.alight);
      if (st.type === 'arrive') {
        if (destMarker._map) c.push(destMarker.getLngLat().toArray());
        if (st.end) c.push(st.end);
      }
      return c;
    }

    // How far through a step we are right now (0…1), from the timetable times
    function stepProgress(st) {
