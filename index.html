      if (st.t0 == null || st.t1 == null) return 0;
      const now = Date.now();
      if (now <= st.t0) return 0;
      if (now >= st.t1) return 1;
      return (now - st.t0) / Math.max(1, st.t1 - st.t0);
    }
    // Split a line at a fraction of its length → [travelled, ahead]
    function splitLine(cs, frac) {
      const total = lengthKm(cs);
      let target = total * frac, acc = 0;
      for (let i = 1; i < cs.length; i++) {
        const d = distKm(cs[i - 1], cs[i]);
        if (acc + d >= target) {
          const r = d ? (target - acc) / d : 0;
          const p = [cs[i - 1][0] + (cs[i][0] - cs[i - 1][0]) * r, cs[i - 1][1] + (cs[i][1] - cs[i - 1][1]) * r];
          return [[...cs.slice(0, i), p], [p, ...cs.slice(i)], p];
        }
        acc += d;
      }
      return [cs, [cs[cs.length - 1]], cs[cs.length - 1]];
    }

    function stepFeatures(steps) {
      const f = [];
      const line = (coords, kind, i, done) => coords.length > 1 &&
        f.push({ type: 'Feature', properties: { kind, step: i, done }, geometry: { type: 'LineString', coordinates: coords } });
      const pt = (c, i, done, label = '') => c &&
        f.push({ type: 'Feature', properties: { kind: 'stop', step: i, done, label }, geometry: { type: 'Point', coordinates: c } });
      const addLine = (coords, kind, i, prog) => {
        if (prog <= 0) line(coords, kind, i, false);
        else if (prog >= 1) line(coords, kind, i, true);
        else { const [a, b] = splitLine(coords, prog); line(a, kind, i, true); line(b, kind, i, false); }
      };
      steps.forEach((st, i) => {
        const prog = stepProgress(st);
        // walking within a change happens at its start; the rest of the window is waiting
        const walkProg = st.type === 'change' && st.walkMin > 0
          ? Math.min(1, Math.max(0, (Date.now() - st.t0) / (st.walkMin * 60000))) : prog;
        (st.lines || []).forEach((l) => addLine(l, 'walk', i, walkProg));
        if (st.type === 'ride' && st.path.length > 1) {
          const { s } = st;
          addLine(st.path, 'ride', i, prog);
          pt(st.path[0], i, prog > 0, platformLabel(s.departure, s.journey));
          pt(st.path[st.path.length - 1], i, prog >= 1, platformLabel(s.arrival, s.journey));
        }
        if (st.type === 'change') {
          pt(st.points[0], i, prog > 0, platformLabel(st.prev.arrival, st.prev.journey));
          pt(st.points[1], i, prog > 0, platformLabel(st.next.departure, st.next.journey));
        }
        if (st.board) pt(st.board, i, prog >= 1, platformLabel(st.next.departure, st.next.journey));
        if (st.alight) pt(st.alight, i, prog > 0, platformLabel(st.from.arrival, st.from.journey));
      });
      return f;
    }

    // Where along the route we are now (time-based estimate), or null before/after the trip
    function currentPosition() {
      for (const st of journeySteps) {
        const prog = stepProgress(st);
        if (prog <= 0 || prog >= 1) continue;
        if (st.type === 'ride' && st.path.length > 1) return splitLine(st.path, prog)[2];
        const walkLine = (st.lines || []).flat();
        if (st.type === 'change') {
          const wp = st.walkMin > 0 ? Math.min(1, (Date.now() - st.t0) / (st.walkMin * 60000)) : 1;
          if (walkLine.length > 1 && wp < 1) return splitLine(walkLine, wp)[2];
          return st.points[st.points.length - 1] || null;
        }
        if (walkLine.length > 1) return splitLine(walkLine, prog)[2];
      }
      return null;
    }
    const nowEl = document.createElement('div');
    nowEl.className = 'route-now';
    const nowMarker = new maplibregl.Marker({ element: nowEl });
    function updateNowMarker() {
      const pos = journeySteps.length ? currentPosition() : null;
      if (pos) { nowMarker.setLngLat(pos); if (!nowMarker._map) nowMarker.addTo(map); }
      else nowMarker.remove();
    }

    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const minutesBetween = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
    function badge(j) {
      const b = mk('span', 'j-badge', lineLabel(j));
      b.style.background = MODE_COLOR[modeOf(j.category)];
      return b;
    }
    // Platform (rail, cable cars) · Bay (bus and tram edges, "Kante") · Pier (boats)
    const nounOf = (mode) => (mode === 'train' || mode === 'cable' ? 'Platform' : mode === 'boat' ? 'Pier' : 'Bay');
    const platformWord = (j) => nounOf(modeOf(j.category));
    const platformOf = (stop) => (stop.prognosis && stop.prognosis.platform) || stop.platform || '–';
    const shortNoun = (noun) => (noun === 'Platform' ? 'Pl.' : noun);

    function tag(kind, iconName, text) {
      const t = mk('span', 'j-tag ' + kind);
      if (iconName) t.innerHTML = icon(iconName);
      t.appendChild(document.createTextNode(text));
      return t;
    }

    const COMPASS8 = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
    const compassWord = (deg) => COMPASS8[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
    const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
    const levelShort = (l) => (l < 0 ? '−' + -l : String(l));
    const fmtDist = (m) => (m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.max(10, Math.round(m / 10) * 10)} m`);

    // "7A-D" → { num: '7', sectors: 'A–D' }; "H" → { num: 'H', sectors: '' }
    function splitPlatform(p) {
      const m = /^(\d+)\s*([A-Z](?:\s*-\s*[A-Z])?|[A-Z]{2,})$/i.exec(p || '');
      if (!m) return { num: p || '', sectors: '' };
      let s = m[2].toUpperCase().replace(/\s*-\s*/, '–');
      if (!s.includes('–') && s.length > 1) s = `${s[0]}–${s[s.length - 1]}`;
      return { num: m[1], sectors: s };
    }

    function flyToPlatform(ll) {
      if (!ll) return;
      const pad = mapPadding();
      map.flyTo({ center: ll, zoom: Math.max(map.getZoom(), 18), offset: [0, (pad.top - pad.bottom) / 2], speed: 1.4 });
    }

    // ---- Where to stand: the platform / bay as a sign, plus side of the road, sectors, level and next stop ----
    function standCard(st) {
      const s = st.s, j = s.journey, mode = modeOf(j.category), at = st.depAt || {};
      const raw = platformOf(s.departure);
      const { num, sectors } = splitPlatform(raw === '–' ? '' : raw);
      const edge = at.edge;
      const label = num || (edge && edge.ref) || '';
      const bearing = edge && edge.bearing != null ? edge.bearing : at.travel;
      const box = mk('div', 'stand');
      const main = mk('div', 'stand-main');
      const sign = mk('div', 'stand-sign' + (label.length > 2 ? ' long' : ''));
      sign.appendChild(mk('small', null, label ? platformWord(j) : 'Stop'));
      if (label) sign.appendChild(mk('b', null, label));
      else { // unsigned stop: an arrow for the direction the vehicle leaves in
        const a = mk('span');
        a.innerHTML = icon('up');
        if (bearing != null) a.style.transform = `rotate(${bearing}deg)`;
        sign.appendChild(a);
      }
      const info = mk('div', 'stand-info');
      info.appendChild(mk('div', 'stand-kicker', 'Where to stand'));
      const headline = sectors ? `${sectors.length === 1 ? 'Sector' : 'Sectors'} ${sectors}`
        : mode !== 'train' && edge && edge.bearing != null ? `${cap(compassWord(edge.bearing + 90))} side of the road` // edges sit right of travel
        : '';
      info.appendChild(mk('div', 'stand-main-text', headline));
      const tags = mk('div', 'tl-tags');
      if (edge && edge.level) tags.appendChild(tag('plain', 'stairs', `Level ${levelShort(edge.level)}`));
      info.appendChild(tags);
      const next = j.passList[1] && j.passList[1].station && j.passList[1].station.name;
      if (next) {
        const row = mk('div', 'stand-next');
        const arrow = mk('span', 'stand-arrow');
        arrow.innerHTML = icon('up');
        if (bearing != null) arrow.style.transform = `rotate(${bearing}deg)`;
        row.append(arrow, mk('span', 'stand-next-k', 'Next stop:'), mk('b', null, next));
        info.appendChild(row);
      }
      main.append(sign, info);
      box.appendChild(main);
      if (!edge) box.appendChild(mk('div', 'stand-note', `Exact ${label ? platformWord(j).toLowerCase() : 'spot'} position unknown — the map shows the stop.`));
      const footRow = mk('div', 'stand-foot');
      const show = mk('button', 'tl-link');
      show.type = 'button';
      show.innerHTML = `Show on map ${icon('chevron')}`;
      show.addEventListener('click', (e) => { e.stopPropagation(); flyToPlatform(st.path[0]); });
      footRow.appendChild(show);
      box.appendChild(footRow);
      return box;
    }

    // ---- Timeline rows: [time] [rail] [body]; tap a row to show that step on the map ----
    const WALK_LINE = { walk: true };
    const railLine = (pos, l) => {
      const e = mk('span', `tl-line ${pos}${l.walk ? ' walk' : ''}`);
      if (l.color) e.style.setProperty('--c', l.color);
      return e;
    };
    function tlRow(i, o) {
      const row = mk('div', 'tl-row ' + (o.stop ? 'stop' : 'leg'));
      row.dataset.step = i;
      row.setAttribute('role', 'listitem');
      const time = mk('div', 'tl-time', o.time || '');
      if (o.delay > 0) time.appendChild(mk('small', null, `+${o.delay}′`));
      const rail = mk('div', 'tl-rail');
      if (o.stop) {
        if (o.top) rail.appendChild(railLine('top', o.top));
        if (o.bot) rail.appendChild(railLine('bot', o.bot));
        const node = mk('span', 'tl-node' + (o.pin ? ' pin' : ''));
        if (o.color) node.style.setProperty('--c', o.color);
        rail.appendChild(node);
      } else rail.appendChild(railLine('full', o.line));
      const body = mk('div', 'tl-body');
      row.append(time, rail, body);
      row.addEventListener('click', () => goToStep(i));
      jList.appendChild(row);
      return body;
    }
    function stopHead(name, plat) {
      const h = mk('div', 'tl-head');
      h.appendChild(mk('b', null, name));
      if (plat) h.appendChild(mk('span', 'tl-plat', plat));
      return h;
    }
    const platSlot = (stop, j) => { const p = platformOf(stop); return p === '–' ? '' : `${shortNoun(platformWord(j))} ${p}`; };
    function titleLine(iconName, ...parts) {
      const t = mk('div', 'tl-title');
      if (iconName) t.insertAdjacentHTML('beforeend', icon(iconName));
      parts.forEach((p) => t.append(typeof p === 'string' ? document.createTextNode(p) : p));
      return t;
    }
    function toggle(label, list, openLabel) {
      const b = mk('button', 'tl-link');
      b.type = 'button';
      b.setAttribute('aria-expanded', 'false');
      const set = (open) => {
        b.setAttribute('aria-expanded', String(open));
        b.innerHTML = `${icon('chevron')} ${open ? openLabel : label}`;
        list.hidden = !open;
      };
      set(false);
      b.addEventListener('click', (e) => { e.stopPropagation(); set(list.hidden); });
      return b;
    }

    // A walking leg: "Walk to Platform 7", minutes · metres, written directions (once routed)
    function walkLeg(i, st, iconName, title, target, minutes, extra) {
      const body = tlRow(i, { line: WALK_LINE, time: minutes ? `${minutes} min` : '' });
      body.appendChild(titleLine(iconName, title));
      const sub = mk('div', 'tl-sub');
      body.appendChild(sub);
      if (extra) body.appendChild(extra);
      const dirs = mk('ol', 'tl-dirs');
      const tog = toggle('Show directions', dirs, 'Hide directions');
      tog.hidden = true;
      body.append(tog, dirs);
      st.ui = Object.assign(st.ui || {}, { sub, dirs, tog, target, minutes });
      renderWalk(st);
    }

    // OSRM steps → short sentences: "Walk 170 m along Schanzenstrasse", "Turn right onto Bubenbergplatz"
    function directionsOf(walks, target) {
      const out = [];
      const verbOf = (mod) => ({ left: 'Turn left', right: 'Turn right', 'slight left': 'Bear left', 'slight right': 'Bear right',
        'sharp left': 'Turn sharp left', 'sharp right': 'Turn sharp right', uturn: 'Turn around' })[mod] || 'Continue';
      const iconOf = (mod) => (/left/.test(mod || '') ? 'left' : /right/.test(mod || '') ? 'right' : 'straight');
      for (const w of walks) {
        for (const s of (w && w.steps) || []) {
          const m = s.maneuver || {}, last = out[out.length - 1];
          if (m.type === 'arrive') continue;
          const gentle = !m.modifier || /straight|slight/.test(m.modifier);
          if (last && m.type !== 'depart' && (s.distance < 8 || (gentle && /continue|new name/.test(m.type) && (!s.name || s.name === last.name)))) {
            last.dist += s.distance;
            continue;
          }
          out.push({ first: m.type === 'depart' && !out.length, verb: verbOf(m.modifier), icon: m.type === 'depart' ? 'walk' : iconOf(m.modifier), name: s.name, dist: s.distance });
        }
      }
      const lines = out.map((d) => ({
        icon: d.icon,
        text: d.first ? `Walk ${fmtDist(d.dist)}${d.name ? ` along ${d.name}` : ''}`
          : d.name ? `${d.verb} onto ${d.name}${d.dist >= 30 ? ` and walk ${fmtDist(d.dist)}` : ''}`
          : `${d.verb} and walk ${fmtDist(d.dist)}`,
      }));
      if (lines.length) lines.push({ icon: 'pin', text: `Arrive at ${target}` });
      return lines;
    }

    // Floor change on a walk ("Go down to level −4", chip "0 → −4"); platforms without a level are at street level
    function levelChange(st) {
      const lv = (x) => (x == null ? 0 : x);
      let from = 0, to = 0;
      const depLevel = (r) => r && r.depAt && r.depAt.edge && r.depAt.edge.level;
      const arrLevel = (r) => r && r.arrAt && r.arrAt.edge && r.arrAt.edge.level;
      if (st.type === 'walk' && !st.final) to = lv(depLevel(st.nextRide));
      else if (st.type === 'walk') from = lv(arrLevel(st.prevRide));
      else if (st.type === 'change') { from = lv(arrLevel(st.prevRide)); to = lv(depLevel(st.nextRide)); }
      if (from === to) return null;
      return { icon: 'stairs', text: `Go ${to < from ? 'down' : 'up'} to ${to === 0 ? 'street level' : 'level ' + levelShort(to)}`, chip: `${levelShort(from)} → ${levelShort(to)}` };
    }

    function renderWalk(st) {
      const ui = st.ui;
      if (!ui || !ui.sub) return;
      const walks = (st.walks || []).filter(Boolean);
      const dist = walks.length && walks.every((w) => w.dist != null) ? walks.reduce((sum, w) => sum + w.dist, 0) : null;
      const parts = [];
      if (st.type === 'change') parts.push(st.walkMin ? `${st.walkMin} min walk` : (st.lines || []).length ? 'Short walk' : 'Same platform');
      else if (ui.minutes) parts.push(`${ui.minutes} min`);
      if (dist) parts.push(fmtDist(dist));
      ui.sub.textContent = parts.join(' · ');
      const lines = directionsOf(walks, ui.target);
      const lvl = levelChange(st);
      if (lvl) lines.splice(Math.min(1, lines.length), 0, lvl);
      ui.dirs.replaceChildren(...lines.map((d) => {
        const li = mk('li');
        li.insertAdjacentHTML('beforeend', icon(d.icon));
        li.appendChild(mk('span', null, d.text));
        if (d.chip) li.appendChild(mk('b', null, d.chip));
        return li;
      }));
      ui.tog.hidden = !lines.length;
    }

    // ---- The whole journey, top to bottom ----
    function renderTimeline(conn) {
      jList.innerHTML = '';
      const steps = journeySteps;
      const rides = steps.filter((x) => x.type === 'ride');
      steps.forEach((st, i) => {
        const prev = steps[i - 1], next = steps[i + 1];
        if (st.type === 'walk' && !st.final) {
          st.nextRide = steps[i + 1];
          const b = tlRow(i, { stop: true, time: fmtTime(st.start || conn.from.departure), bot: WALK_LINE });
          b.appendChild(stopHead(userLngLat ? 'Your location' : 'Map centre'));
          const s = st.next, slot = platSlot(s.departure, s.journey);
          const target = slot ? `${platformWord(s.journey)} ${platformOf(s.departure)}` : s.departure.station.name;
          walkLeg(i, st, 'walk', `Walk to ${target}`, target, st.min);
        } else if (st.type === 'ride') {
          const s = st.s, j = s.journey, color = MODE_COLOR[modeOf(j.category)];
          const into = prev && (prev.type === 'walk' || prev.type === 'change') ? WALK_LINE : null;
          const dep = tlRow(i, { stop: true, time: fmtTime(s.departure.departure), delay: s.departure.delay, top: into, bot: { color }, color });
          dep.appendChild(stopHead(s.departure.station.name, platSlot(s.departure, j)));
          st.ui = { };
          dep.appendChild(standCard(st));
          const mins = minutesBetween(s.departure.departure, s.arrival.arrival);
          const ride = tlRow(i, { line: { color } });
          ride.appendChild(titleLine(null, badge(j), `→ ${j.to}`));
          const mid = j.passList.slice(1, -1);
          ride.appendChild(mk('div', 'tl-sub', mid.length ? `${mid.length} stop${mid.length === 1 ? '' : 's'} · ${mins} min` : `Non-stop · ${mins} min`));
          if (mid.length) {
            const list = mk('ol', 'tl-stops');
            mid.forEach((c) => {
              const li = mk('li');
              li.append(mk('time', null, fmtTime(c.departure || c.arrival)), mk('span', null, c.station && c.station.name || ''));
              list.appendChild(li);
            });
            ride.append(toggle(`Show ${mid.length} stop${mid.length === 1 ? '' : 's'}`, list, 'Hide stops'), list);
          }
          const arr = tlRow(i, { stop: true, time: fmtTime(s.arrival.arrival), delay: s.arrival.delay, top: { color }, bot: next ? WALK_LINE : null, color });
          arr.appendChild(stopHead(s.arrival.station.name, platSlot(s.arrival, j)));
        } else if (st.type === 'change') {
          st.prevRide = prev; st.nextRide = next;
          const n = st.next, slot = platSlot(n.departure, n.journey);
          const target = slot ? `${platformWord(n.journey)} ${platformOf(n.departure)}` : n.departure.station.name;
          const wait = minutesBetween(st.prev.arrival.arrival, n.departure.departure);
          const spare = wait - (st.walkMin || 0);
          const tags = mk('div', 'tl-tags');
          tags.appendChild(spare >= 2 ? tag('ok', 'check', `${spare} min to spare`)
            : spare >= 0 ? tag('warn', 'change', `Tight: ${spare} min to spare`) : tag('warn', 'change', 'Very tight change'));
          walkLeg(i, st, 'change', `Change to ${target}`, target, wait, tags);
        } else if (st.type === 'walk') {
          st.prevRide = rides[rides.length - 1];
          walkLeg(i, st, 'walk', `Walk to ${st.toName}`, st.toName, st.min);
        } else {
          const b = tlRow(i, { stop: true, time: fmtTime(st.time), top: prev ? WALK_LINE : null, pin: true });
          b.appendChild(stopHead(st.destTitle));
          b.appendChild(mk('div', 'tl-sub', dayLabel(st.time)));
        }
      });
      markDone();
    }

    // Steps already behind you are greyed out
    function markDone() {
      jList.querySelectorAll('.tl-row').forEach((r) => {
        const st = journeySteps[+r.dataset.step];
        r.classList.toggle('done', !!st && st.type !== 'arrive' && stepProgress(st) >= 1);
      });
    }


    function stepChip(st, i) {
      const chip = mk('button', 'j-chip');
      chip.type = 'button';
      chip.dataset.step = i;
      if (st.type === 'walk') {
        chip.innerHTML = icon('walk');
        chip.appendChild(document.createTextNode(`${st.min}`));
      } else if (st.type === 'ride') {
        chip.appendChild(badge(st.s.journey));
      } else if (st.type === 'change') {
        chip.innerHTML = icon('change');
        chip.setAttribute('aria-label', 'Change');
      } else {
        chip.innerHTML = icon('pin');
        chip.setAttribute('aria-label', 'Arrival');
      }
      chip.addEventListener('click', () => goToStep(i, true));
      return chip;
    }

    // ---- Top pill: SBB-style bar, time-proportional, a point at every change, green up to "now" ----
    function renderBar(conn) {
      const bar = document.getElementById('jBar');
      bar.innerHTML = '';
      const t0 = new Date(conn.from.departure).getTime();
      const t1 = new Date(conn.to.arrival).getTime();
      const span = Math.max(1, t1 - t0);
      const pct = (t) => Math.min(100, Math.max(0, ((t - t0) / span) * 100));
      const segs = [];
      const nodes = [0, 100];
      let prevRideEnd = null;
      conn.sections.forEach((s) => {
        let a, b, kind;
        let color = null;
        if (s.journey) {
          a = new Date(s.departure.departure).getTime();
          b = new Date(s.arrival.arrival).getTime();
          kind = 'ride';
          color = MODE_COLOR[modeOf(s.journey.category)];
          if (prevRideEnd != null) nodes.push((prevRideEnd + pct(a)) / 2); // one point per change
          prevRideEnd = pct(b);
        } else {
          a = new Date(s.departure.departure || conn.from.departure).getTime();
          b = s.arrival.arrival ? new Date(s.arrival.arrival).getTime() : a + (s.walk && s.walk.duration || 0) * 1000;
          kind = 'walk';
        }
        if (b > a) segs.push({ kind, color, l: pct(a), w: pct(b) - pct(a) });
      });
      const pts = nodes.sort((x, y) => x - y).filter((x, i, arr) => i === 0 || x === 100 || x - arr[i - 1] > 6);
      // two identical layers: the "done" copy is green and clipped to the progress
      ['', 'done'].forEach((cls) => {
        const layer = mk('div', 'j-layer' + (cls ? ' ' + cls : ''));
        layer.appendChild(mk('span', 'j-base'));
        segs.forEach((sg) => {
          const e = mk('span', `j-seg ${sg.kind}`);
          e.style.left = sg.l + '%';
          e.style.width = sg.w + '%';
          if (sg.color) e.style.setProperty('--seg', sg.color);
          layer.appendChild(e);
        });
        bar.appendChild(layer);
      });
      pts.forEach((x) => {
        const n = mk('span', 'j-node' + (x === 0 || x === 100 ? ' end' : ''));
        n.style.left = x + '%';
        n.dataset.at = x;
        bar.appendChild(n);
      });
      bar.appendChild(mk('span', 'j-now'));
      updateProgress();
    }
    function updateProgress() {
      if (!journeyConn) return;
      const t0 = new Date(journeyConn.from.departure).getTime();
      const t1 = new Date(journeyConn.to.arrival).getTime();
      const p = Math.min(100, Math.max(0, ((Date.now() - t0) / Math.max(1, t1 - t0)) * 100));
      const bar = document.getElementById('jBar');
      bar.style.setProperty('--p', p + '%');
      bar.classList.toggle('live', p > 0 && p < 100);
      bar.querySelectorAll('.j-node').forEach((n) => n.classList.toggle('done', +n.dataset.at <= p && p > 0));
      // map: travelled part green, plus a marker where you should be now
      if (journeySteps.length) { setRoute(stepFeatures(journeySteps)); updateNowMarker(); markDone(); }
    }

    function renderJourney(conn, destTitle) {
      journeyConn = conn;
      journeySteps = buildSteps(conn, destTitle);
      journeyStep = 0;
      document.getElementById('jDep').textContent = fmtTime(conn.from.departure);
      document.getElementById('jArr').textContent = fmtTime(conn.to.arrival);
      document.getElementById('jTo').textContent = destTitle;
      document.getElementById('jSub').textContent =
        `${dayLabel(conn.from.departure)} · ${fmtDuration(conn.duration)}` +
        (conn.transfers ? ` · ${conn.transfers} change${conn.transfers > 1 ? 's' : ''}` : ' · direct');
      renderBar(conn);
      jStrip.innerHTML = '';
      jStatus.textContent = '';
      journeySteps.forEach((st, i) => {
        if (i) jStrip.appendChild(mk('span', 'j-chev', '›'));
        jStrip.appendChild(stepChip(st, i));
      });
      renderTimeline(conn);
      jList.scrollTop = 0;
      setRoute(stepFeatures(journeySteps));
      showStep(false);
      fitJourney(); // overview first; tapping a step then zooms into it
    }

    function showStep(fit) {
      jList.querySelectorAll('.tl-row').forEach((r) => r.classList.toggle('active', +r.dataset.step === journeyStep));
      jStrip.querySelectorAll('.j-chip').forEach((c) => c.classList.toggle('active', +c.dataset.step === journeyStep));
      const active = jStrip.querySelector('.j-chip.active');
      if (active) jStrip.scrollTo({ left: active.offsetLeft - 18, behavior: 'smooth' });
      refreshRouteHighlight();
      if (fit) fitStep(journeyStep);
    }
    function goToStep(i, scroll) {
      if (!journeySteps.length) return;
      journeyStep = Math.min(journeySteps.length - 1, Math.max(0, i));
      showStep(true);
      const row = scroll && jList.querySelector(`.tl-row[data-step="${journeyStep}"]`);
      if (row) jList.scrollTo({ top: row.offsetTop - 4, behavior: 'smooth' });
    }

    function mapPadding() {
      const h = journeyEl.getBoundingClientRect().height || 300;
      return { top: document.body.classList.contains('journey-mode') ? 150 : 80, bottom: h + 40, left: 40, right: 40 };
    }
    function fitCoords(coords) {
      if (!coords.length) return;
      const b = coords.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      map.fitBounds(b, { padding: mapPadding(), maxZoom: 17, duration: 700 });
    }
    function fitJourney() {
      const all = [];
      journeySteps.forEach((st) => all.push(...stepCoords(st)));
      requestAnimationFrame(() => fitCoords(all));
    }
    function fitStep(i) {
      const st = journeySteps[i];
      if (st) fitCoords(stepCoords(st));
    }

    async function startJourney(r, keepQuery) {
      const id = ++journeyReq;
      if (!keepQuery) journeyQuery = { mode: 'dep', date: '', time: '' };
      journeyDest = r;
      journeyConn = null;
      journeySteps = [];
      wrap.classList.remove('collapsed');
      wrap.classList.add('journey-open');
      document.body.classList.add('journey-mode');
      setMenu(false);
      jStrip.innerHTML = '';
      jList.innerHTML = '';
      document.getElementById('jBar').innerHTML = '';
      document.getElementById('jDep').textContent = '--:--';
      document.getElementById('jArr').textContent = '--:--';
      document.getElementById('jTo').textContent = r.title;
      document.getElementById('jSub').textContent = '';
      jStatus.textContent = 'Finding a connection…';
      setRoute([]);
      if (!keepQuery) map.flyTo({ center: r.lngLat, zoom: 14, speed: 1.4, offset: [0, -150] }); // keep the pin above the widget
      clearInterval(progressTimer);
      progressTimer = setInterval(updateProgress, 15000);

      const from = userLngLat || map.getCenter().toArray();
      try {
        // exact platforms if their data is there in time; never hold a journey up for more than 4 s
        const [conn] = await Promise.all([findConnection(from, r), Promise.race([platformsReady, new Promise((ok) => setTimeout(ok, 4000))])]);
        if (id !== journeyReq) return;
        if (!conn) { jStatus.textContent = 'No public transport connection found for this trip.'; return; }
        renderJourney(conn, r.title);
        refineJourney(id); // swap straight lines for real walking paths and tracks/roads
        if (!userLngLat) document.getElementById('jSub').textContent += ' · from map centre';
      } catch (e) {
        if (id === journeyReq) jStatus.textContent = 'Connections could not be loaded. Check your internet connection.';
      }
    }

    // ---- Time picker: tap the departure or arrival time ----
    const tSheet = document.getElementById('tSheet');
    const tDim = document.getElementById('tDim');
    const tDate = document.getElementById('tDate');
    const tTime = document.getElementById('tTime');
    let tMode = 'dep';
    const pad2 = (n) => String(n).padStart(2, '0');
    const dateValue = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const timeValue = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    function setTMode(m) {
      tMode = m;
      document.querySelectorAll('#tSeg button').forEach((b) => b.classList.toggle('active', b.dataset.mode === m));
    }
    function openTimeSheet(mode) {
      if (!journeyDest) return;
      setTMode(mode);
      const ref = journeyConn ? new Date(mode === 'arr' ? journeyConn.to.arrival : journeyConn.from.departure) : new Date();
      tDate.value = journeyQuery.date || dateValue(ref);
      tTime.value = journeyQuery.time || timeValue(ref);
      if (journeyQuery.mode !== mode && journeyConn) { tDate.value = dateValue(ref); tTime.value = timeValue(ref); }
      tSheet.classList.add('open');
      tDim.classList.add('open');
      tSheet.setAttribute('aria-hidden', 'false');
    }
    function closeTimeSheet() {
      tSheet.classList.remove('open');
      tDim.classList.remove('open');
      tSheet.setAttribute('aria-hidden', 'true');
    }
    document.getElementById('jDepBtn').addEventListener('click', () => openTimeSheet('dep'));
    document.getElementById('jArrBtn').addEventListener('click', () => openTimeSheet('arr'));
    document.querySelectorAll('#tSeg button').forEach((b) => b.addEventListener('click', () => setTMode(b.dataset.mode)));
    tDim.addEventListener('click', closeTimeSheet);
    document.getElementById('tNow').addEventListener('click', () => {
      journeyQuery = { mode: 'dep', date: '', time: '' };
      closeTimeSheet();
      startJourney(journeyDest, true);
    });
    document.getElementById('tDone').addEventListener('click', () => {
      journeyQuery = { mode: tMode, date: tDate.value, time: tTime.value };
      closeTimeSheet();
      startJourney(journeyDest, true);
    });

    // ---------- Accurate route shapes ----------
    // Timetables only give stop coordinates, so the lines between them are routed:
    //   walking → OSM foot routing (routing.openstreetmap.de), trains → BRouter rail profile (brouter.de),
    //   buses/trams → OSM road routing. Anything implausible falls back to the straight line.
    const routeCache = new Map();
    function getJSON(url) {
      if (!routeCache.has(url)) routeCache.set(url, fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null));
      return routeCache.get(url);
    }
    function distKm(a, b) {
      const R = 6371, toRad = Math.PI / 180;
      const dLat = (b[1] - a[1]) * toRad, dLng = (b[0] - a[0]) * toRad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * toRad) * Math.cos(b[1] * toRad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const lengthKm = (cs) => cs.reduce((sum, c, i) => (i ? sum + distKm(cs[i - 1], c) : 0), 0);
    const plausible = (route, straight) => route && route.length > 1 && lengthKm(route) <= Math.max(lengthKm(straight) * 2.5, lengthKm(straight) + 0.4);
    const ll = (c) => `${c[0].toFixed(6)},${c[1].toFixed(6)}`;

    // → { coords, steps (OSRM turn-by-turn, or null), dist (m, or null) }
    async function routeWalk(a, b) {
      if (distKm(a, b) < 0.02) return { coords: [a, b], steps: null, dist: Math.round(distKm(a, b) * 1000) };
      const d = await getJSON(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${ll(a)};${ll(b)}?overview=full&geometries=geojson&steps=true`);
      const r = d && d.code === 'Ok' && d.routes[0];
      const g = r && r.geometry.coordinates;
      return plausible(g, [a, b]) ? { coords: [a, ...g, b], steps: r.legs[0].steps, dist: r.distance } : { coords: [a, b], steps: null, dist: null };
    }

    async function routeRide(path, mode) {
      if (path.length < 2) return path;
      let g = null;
      if (mode === 'train') {
        const d = await getJSON(`https://brouter.de/brouter?lonlats=${path.map(ll).join('|')}&profile=rail&alternativeidx=0&format=geojson`);
        g = d && d.features && d.features[0] && d.features[0].geometry.coordinates.map((c) => [c[0], c[1]]);
      } else if (mode === 'bus' || mode === 'tram') {
        const d = await getJSON(`https://routing.openstreetmap.de/routed-car/route/v1/driving/${path.map(ll).join(';')}?overview=full&geometries=geojson`);
        g = d && d.code === 'Ok' && d.routes[0] && d.routes[0].geometry.coordinates;
      }
      return plausible(g, path) ? [path[0], ...g, path[path.length - 1]] : path;
    }

    function refineJourney(id) {
      let pending = 0, scheduled = false;
      const redraw = () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => { scheduled = false; if (id === journeyReq) { setRoute(stepFeatures(journeySteps)); updateNowMarker(); } });
      };
      const task = (promise, apply) => {
        pending++;
        promise.then((res) => { if (id !== journeyReq) return; apply(res); redraw(); });
      };
      journeySteps.forEach((st) => {
        (st.lines || []).forEach((line, k) => task(routeWalk(line[0], line[line.length - 1]), (res) => {
          st.lines[k] = res.coords;
          (st.walks || (st.walks = []))[k] = res;
          renderWalk(st);
        }));
        if (st.type === 'ride') task(routeRide(st.path, modeOf(st.s.journey.category)), (res) => { st.path = res; });
      });
    }

    // Timetable data: transport.opendata.ch (the official Swiss timetable, incl. SBB, PostBus, city transport)
    const OPENDATA = 'https://transport.opendata.ch/v1/';
    const coordParam = (ll) => `${ll[1].toFixed(6)},${ll[0].toFixed(6)}`; // lat,lng
    async function nearestStation(ll) {
      const res = await fetch(`${OPENDATA}locations?` + new URLSearchParams({ x: ll[1], y: ll[0], type: 'station' }));
      const data = await res.json();
      const st = (data.stations || []).find((x) => x.id);
      return st ? st.id : null;
    }
    async function connections(from, to) {
      if (!from || !to) return null;
      const q = { from, to, limit: '5' };
      const { mode, date, time } = journeyQuery;
      if (date) q.date = date;
      if (time) q.time = time;
      if (mode === 'arr' && (date || time)) q.isArrivalTime = '1';
      const res = await fetch(`${OPENDATA}connections?` + new URLSearchParams(q));
      const data = await res.json();
      const list = data.connections || [];
      if (!list.length) return null;
      if (mode === 'arr' && (date || time)) {
        // latest connection that still arrives by the chosen time
        const target = new Date(`${date || dateValue(new Date())}T${time || timeValue(new Date())}`).getTime();
        const ok = list.filter((c) => new Date(c.to.arrival).getTime() <= target + 60000);
        return (ok.length ? ok : list).reduce((best, c) => (new Date(c.to.arrival) > new Date(best.to.arrival) ? c : best));
      }
      const after = date || time
        ? new Date(`${date || dateValue(new Date())}T${time || timeValue(new Date())}`).getTime() - 60000
        : Date.now() - 60000;
      return list.find((c) => new Date(c.from.departure).getTime() >= after) || list[0];
    }
    // Exact coordinates can fail when a point is far from any stop (e.g. a municipality's centre in the fields),
    // so fall back to the place name and then to the nearest stations at either end.
    async function findConnection(fromLL, r) {
      const from = coordParam(fromLL), to = coordParam(r.lngLat);
      let c = await connections(from, to);
      if (c) return c;
      if (r.origin === 'gg25' || r.origin === 'gazetteer') {
        c = await connections(from, r.title.replace(/\s*\([A-Z]{2}\)\s*$/, ''));
        if (c) return c;
      }
      const toStation = await nearestStation(r.lngLat);
      c = await connections(from, toStation);
      if (c) return c;
      const fromStation = await nearestStation(fromLL);
      return connections(fromStation, toStation);
    }

    function endJourney() {
      journeyReq++;
      wrap.classList.remove('journey-open');
      document.body.classList.remove('journey-mode');
      clearInterval(progressTimer);
      journeyConn = null;
      journeyDest = null;
      nowMarker.remove();
      closeTimeSheet();
      setRoute([]);
      journeySteps = [];
      destMarker.remove();
      input.value = '';
      results = [];
      clearBtn.classList.remove('show');
      render();
      if (userLngLat) map.flyTo({ center: userLngLat, zoom: 15 });
    }
    document.getElementById('jClose').addEventListener('click', endJourney);

    // ---------- Event page (URL: #event/<id>, so the back gesture/button works) ----------
    const evPage = document.getElementById('evPage');
    const evHero = document.getElementById('evHero');
    const evContent = document.getElementById('evContent');
    let pageEvent = null;
    let pushedHash = false;

    const findEvent = (id) => EVENTS.features.find((f) => f.properties.id === id);

    function openEvent(id) {
      pushedHash = true;
      location.hash = 'event/' + encodeURIComponent(id);
    }

    function renderEventPage(f) {
      const p = f.properties;
      pageEvent = f;
      evHero.style.setProperty('--c', p.color);
      evContent.style.setProperty('--c', p.color);
      [...evHero.children].forEach((n) => { if (n.id !== 'evBack') n.remove(); });
      evHero.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${EVENTS.GLYPHS[p.cat]}"/></svg>`);
      if (p.image) {
        const img = document.createElement('img');
        img.src = p.image;
        img.alt = '';
        img.onerror = () => img.remove();
        evHero.appendChild(img);
      }
      document.getElementById('evCat').textContent = p.category;
      document.getElementById('evTitle').textContent = p.title;
      document.getElementById('evWhen').textContent = p.when;
      document.getElementById('evCost').textContent = p.cost;
      document.getElementById('evAttendance').textContent = p.attendance;
      document.getElementById('evOrganizer').href = p.url;
      document.getElementById('evVenue').textContent = p.venue;
      document.getElementById('evCity').textContent = p.city;
      document.getElementById('evAbout').textContent = p.about;
      document.getElementById('evAudience').textContent = p.audience;
      evPage.scrollTop = 0;
    }

    function routeFromHash() {
      const m = location.hash.match(/^#event\/(.+)$/);
      const f = m && findEvent(decodeURIComponent(m[1]));
      if (f) {
        renderEventPage(f);
        input.blur();
        setMenu(false);
        evPage.classList.add('open');
        evPage.setAttribute('aria-hidden', 'false');
        document.getElementById('evBack').focus();
      } else {
        evPage.classList.remove('open');
        evPage.setAttribute('aria-hidden', 'true');
      }
    }

    function closeEvent() {
      if (pushedHash) { pushedHash = false; history.back(); }
      else history.replaceState(null, '', location.pathname + location.search);
      routeFromHash();
    }

    window.addEventListener('hashchange', () => { if (!location.hash) pushedHash = false; routeFromHash(); });
    document.getElementById('evBack').addEventListener('click', closeEvent);
    document.getElementById('evShowMap').addEventListener('click', () => {
      const f = pageEvent;
      closeEvent();
      if (f) {
        setEventsOn(true);
        map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 16), speed: 1.4 });
      }
    });
    routeFromHash(); // a shared #event/… link opens straight on the page

    // ---------- Keep the bar above the iOS keyboard ----------
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const place = () => {
        const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        wrap.style.bottom = kb > 0 ? (kb + 8) + 'px' : '';
        list.style.maxHeight = kb > 0 ? (vv.height - 52 - 40) + 'px' : '';
      };
      vv.addEventListener('resize', place);
      vv.addEventListener('scroll', place);
    }
  </script>
</body>
</html>
