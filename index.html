    });

    // Tapping the map closes the keyboard, results and menu
    map.on('mousedown', () => { input.blur(); setMenu(false); });
    map.on('touchstart', () => { input.blur(); setMenu(false); });
    input.addEventListener('blur', () => list.classList.remove('open'));

    // ---------- Journey (public transport via transport.opendata.ch) ----------
    const ROUTE_FC = { type: 'FeatureCollection', features: [] };
    let journeyStep = 0;
    let journeySteps = [];
    let journeyReq = 0;
    const journeyEl = document.getElementById('journey');
    const jStrip = document.getElementById('jStrip');
    const jTrack = document.getElementById('jTrack');
    const jViewport = document.getElementById('jViewport');
    const jDots = document.getElementById('jDots');
    const jStatus = document.getElementById('jStatus');
    let journeyConn = null;
    let journeyDest = null;
    let journeyQuery = { mode: 'dep', date: '', time: '' }; // empty date/time = now
    let progressTimer = null;

    const ROUTE_BLUE = '#0a6cff';
    const routeColor = (theme) => ['case', ['==', ['get', 'done'], true], theme === 'dark' ? '#2fa84f' : '#34c759', ROUTE_BLUE];
    const stepOpacity = (dim) => ['case', ['==', ['get', 'step'], journeyStep], 1, dim];

    function routeLayers(theme) {
      const bg = theme === 'dark' ? '#1c1f24' : '#ffffff';
      return [
        { id: 'route-casing', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'ride'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': bg, 'line-width': 10, 'line-opacity': stepOpacity(.6) } },
        { id: 'route-ride', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'ride'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': routeColor(theme), 'line-width': 6, 'line-opacity': stepOpacity(.4) } },
        { id: 'route-walk', type: 'line', source: 'route', filter: ['==', ['get', 'kind'], 'walk'],
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': routeColor(theme), 'line-width': 5, 'line-dasharray': [0, 1.8], 'line-opacity': stepOpacity(.4) } },
        { id: 'route-stops', type: 'circle', source: 'route', filter: ['==', ['get', 'kind'], 'stop'],
          paint: { 'circle-radius': 5.5, 'circle-color': bg, 'circle-stroke-color': routeColor(theme), 'circle-stroke-width': 3,
                   'circle-opacity': stepOpacity(.6), 'circle-stroke-opacity': stepOpacity(.5) } },
      ];
    }

    function refreshRouteHighlight() {
      if (!map.getLayer('route-ride')) return;
      map.setPaintProperty('route-casing', 'line-opacity', stepOpacity(.6));
      map.setPaintProperty('route-ride', 'line-opacity', stepOpacity(.4));
      map.setPaintProperty('route-walk', 'line-opacity', stepOpacity(.4));
      map.setPaintProperty('route-stops', 'circle-opacity', stepOpacity(.6));
      map.setPaintProperty('route-stops', 'circle-stroke-opacity', stepOpacity(.5));
    }

    function setRoute(features) {
      ROUTE_FC.features = features;
      const src = map.getSource('route');
      if (src) src.setData(ROUTE_FC);
    }

    const MODE_ICON = {
      train: '<path d="M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3zM4 10h16M8 17l-2 4M16 17l2 4"/>',
      tram:  '<path d="M7 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM9 2.5h6M12 2.5V6M5 12h14M8 18l-2 3M16 18l2 3"/>',
      bus:   '<path d="M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 17v3M17 17v3"/>',
      boat:  '<path d="M3 15l2 5h14l2-5zM6 15V9h12v6M12 5v4"/>',
      cable: '<path d="M3 4l18 4M12 6v4M7 10h10v8H7zM7 14h10"/>',
      walk:  '<circle cx="13" cy="4.2" r="1.9"/><path d="M10.5 21l1.5-5.5 2.5 2.5v3M8.5 12.5l2.5-4.5 3 1 2 3.5M12 15.5l-1.2-6.5"/>',
      pin:   '<path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>',
      change: '<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>',
      arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    };
    const MODE_COLOR = { train: '#eb0000', tram: '#0a84ff', bus: '#3c3c8c', boat: '#00a3c4', cable: '#8e8e93' };
    const icon = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${MODE_ICON[name]}</svg>`;

    function modeOf(category = '') {
      const c = category.toUpperCase();
      if (/^(IC|ICE|ICN|IR|IRE|EC|EN|EXT|NJ|RE|R|RB|S|SN|PE|TGV|RJX|TER)$/.test(c)) return 'train';
      if (/^(T|TRAM|M)$/.test(c)) return 'tram';
      if (/^(BAT|FAE|BAV)$/.test(c)) return 'boat';
      if (/^(FUN|PB|GB|SL|LB|ASC)$/.test(c)) return 'cable';
      return 'bus';
    }
    function lineLabel(j) {
      const c = (j.category || '').toUpperCase();
      const n = j.number || '';
      if (!n) return c;
      if (/^(S|SN|R|RE|IR|IC|EC|ICE)$/.test(c)) return /^(S|SN)$/.test(c) ? c + n : `${c} ${n}`;
      if (c === 'B' || c === 'T' || c === 'BUS' || c === 'TRAM') return n;
      return `${c} ${n}`;
    }

    const fmtTime = (iso) => iso ? new Date(iso).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) : '--:--';
    function fmtDuration(d) {
      const m = /(\d+)d(\d+):(\d+)/.exec(d || '');
      if (!m) return '';
      const h = +m[1] * 24 + +m[2], min = +m[3];
      return h ? `${h} h ${min} min` : `${min} min`;
    }
    function dayLabel(iso) {
      const d = new Date(iso), now = new Date();
      const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
      if (d.toDateString() === now.toDateString()) return 'Today';
      if (d.toDateString() === tomorrow.toDateString()) return 'Tomorrow';
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }
    const coordOf = (stop) => {
      const c = stop && (stop.station || stop.location) && (stop.station || stop.location).coordinate;
      return c && c.x != null && c.y != null ? [c.y, c.x] : null; // API: x = lat, y = lng
    };

    // Turn the API's sections into swipeable steps: walk → ride → change → ride → … → walk → arrive
    function buildSteps(conn, destTitle) {
      const steps = [];
      let walk = { min: 0, lines: [], start: null };
      let lastRide = null;
      const flushWalk = () => { const w = walk; walk = { min: 0, lines: [], start: null }; return w; };
      for (const s of conn.sections) {
        if (!s.journey) {
          walk.min += Math.round((s.walk && s.walk.duration || 0) / 60);
          walk.start = walk.start || s.departure.departure;
          const a = coordOf(s.departure), b = coordOf(s.arrival);
          if (a && b) walk.lines.push([a, b]);
          continue;
        }
        const w = flushWalk();
        if (!lastRide) {
          if (w.min > 0) {
            const t0 = new Date(w.start || conn.from.departure).getTime();
            steps.push({ type: 'walk', min: w.min, lines: w.lines, start: w.start, toName: s.departure.station.name, next: s, t0, t1: t0 + w.min * 60000 });
          }
        } else {
          const t0 = new Date(lastRide.arrival.arrival).getTime();
          steps.push({ type: 'change', prev: lastRide, next: s, walkMin: w.min, lines: w.lines,
            points: [coordOf(lastRide.arrival), coordOf(s.departure)].filter(Boolean),
            t0, t1: w.min > 0 ? t0 + w.min * 60000 : new Date(s.departure.departure).getTime() });
        }
        steps.push({ type: 'ride', s, path: s.journey.passList.map(coordOf).filter(Boolean),
          t0: new Date(s.departure.departure).getTime(), t1: new Date(s.arrival.arrival).getTime() });
        lastRide = s;
      }
      const w = flushWalk();
      if (w.min > 0 || !lastRide) {
        const t0 = new Date(w.start || (lastRide ? lastRide.arrival.arrival : conn.from.departure)).getTime();
        steps.push({ type: 'walk', min: w.min, lines: w.lines, start: w.start, toName: destTitle, final: true, t0, t1: t0 + w.min * 60000 });
      }
      steps.push({ type: 'arrive', destTitle, time: conn.to.arrival, from: lastRide });
      return steps;
    }

    function stepCoords(st) {
      const c = [];
      (st.lines || []).forEach((l) => c.push(...l));
      if (st.path) c.push(...st.path);
      if (st.points) c.push(...st.points);
      if (st.type === 'arrive') {
        if (destMarker._map) c.push(destMarker.getLngLat().toArray());
        if (st.from) { const e = coordOf(st.from.arrival); if (e) c.push(e); }
      }
      return c;
    }

    // How far through a step we are right now (0…1), from the timetable times
    function stepProgress(st) {
      if (st.t0 == null || st.t1 == null) return 0;
      const now = Date.now();
      if (now <= st.t0) return 0;
      if (now >= st.t1) return 1;
      return (now - st.t0) / Math.max(1, st.t1 - st.t0);
    }
    // Split a line at a fraction of its length → [travelled, ahead]
    function splitLine(cs, frac) {
      const total = lengthKm(cs);
      let target = total * frac, acc = 0;
      for (let i = 1; i < cs.length; i++) {
        const d = distKm(cs[i - 1], cs[i]);
        if (acc + d >= target) {
          const r = d ? (target - acc) / d : 0;
          const p = [cs[i - 1][0] + (cs[i][0] - cs[i - 1][0]) * r, cs[i - 1][1] + (cs[i][1] - cs[i - 1][1]) * r];
          return [[...cs.slice(0, i), p], [p, ...cs.slice(i)], p];
        }
        acc += d;
      }
      return [cs, [cs[cs.length - 1]], cs[cs.length - 1]];
    }

    function stepFeatures(steps) {
      const f = [];
      const line = (coords, kind, i, done) => coords.length > 1 &&
        f.push({ type: 'Feature', properties: { kind, step: i, done }, geometry: { type: 'LineString', coordinates: coords } });
      const pt = (c, i, done) => f.push({ type: 'Feature', properties: { kind: 'stop', step: i, done }, geometry: { type: 'Point', coordinates: c } });
      const addLine = (coords, kind, i, prog) => {
        if (prog <= 0) line(coords, kind, i, false);
        else if (prog >= 1) line(coords, kind, i, true);
        else { const [a, b] = splitLine(coords, prog); line(a, kind, i, true); line(b, kind, i, false); }
      };
      steps.forEach((st, i) => {
        const prog = stepProgress(st);
        // walking within a change happens at its start; the rest of the window is waiting
        const walkProg = st.type === 'change' && st.walkMin > 0
          ? Math.min(1, Math.max(0, (Date.now() - st.t0) / (st.walkMin * 60000))) : prog;
        (st.lines || []).forEach((l) => addLine(l, 'walk', i, walkProg));
        if (st.type === 'ride' && st.path.length > 1) {
          addLine(st.path, 'ride', i, prog);
          pt(st.path[0], i, prog > 0);
          pt(st.path[st.path.length - 1], i, prog >= 1);
        }
        if (st.type === 'change') st.points.forEach((c) => pt(c, i, prog > 0));
      });
      return f;
    }

    // Where along the route we are now (time-based estimate), or null before/after the trip
    function currentPosition() {
      for (const st of journeySteps) {
        const prog = stepProgress(st);
        if (prog <= 0 || prog >= 1) continue;
        if (st.type === 'ride' && st.path.length > 1) return splitLine(st.path, prog)[2];
        const walkLine = (st.lines || []).flat();
        if (st.type === 'change') {
          const wp = st.walkMin > 0 ? Math.min(1, (Date.now() - st.t0) / (st.walkMin * 60000)) : 1;
          if (walkLine.length > 1 && wp < 1) return splitLine(walkLine, wp)[2];
          return st.points[st.points.length - 1] || null;
        }
        if (walkLine.length > 1) return splitLine(walkLine, prog)[2];
      }
      return null;
    }
    const nowEl = document.createElement('div');
    nowEl.className = 'route-now';
    const nowMarker = new maplibregl.Marker({ element: nowEl });
    function updateNowMarker() {
      const pos = journeySteps.length ? currentPosition() : null;
      if (pos) { nowMarker.setLngLat(pos); if (!nowMarker._map) nowMarker.addTo(map); }
      else nowMarker.remove();
    }

    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const minutesBetween = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000));
    function badge(j) {
      const mode = modeOf(j.category);
      const b = mk('span', 'j-badge');
      b.style.background = MODE_COLOR[mode];
      b.innerHTML = icon(mode);
      b.appendChild(document.createTextNode(lineLabel(j)));
      return b;
    }
    const platformWord = (j) => modeOf(j.category) === 'train' ? 'Platform' : 'Stop';
    function kicker(iconName, text) {
      const k = mk('div', 'j-kicker');
      k.innerHTML = icon(iconName);
      k.appendChild(document.createTextNode(text));
      return k;
    }
    function fact(label, value, opts = {}) {
      const f = mk('div', 'j-fact');
      f.appendChild(mk('div', 'j-label', label));
      const v = mk('div', 'v' + (opts.small ? ' sm' : ''), value);
      if (opts.delay > 0) v.appendChild(mk('span', 'j-delay', `+${opts.delay}′`));
      f.appendChild(v);
      if (opts.sub) f.appendChild(mk('div', 'sub', opts.sub));
      return f;
    }
    function facts(...items) {
      const g = mk('div', 'j-facts' + (items.length === 1 ? ' one' : ''));
      g.append(...items);
      return g;
    }
    function take(label, j) {
      const t = mk('div', 'j-take');
      if (label) t.appendChild(mk('span', 'lbl', label));
      t.append(badge(j), mk('span', 'dir', `→ ${j.to}`));
      return t;
    }
    function note(parts) { // [text, bold, text, …]
      const n = mk('div', 'j-note');
      parts.forEach((t, i) => n.appendChild(i % 2 ? mk('b', null, t) : document.createTextNode(t)));
      return n;
    }
    function alertLine(iconName, text) {
      const a = mk('div', 'j-alert');
      a.innerHTML = icon(iconName);
      a.appendChild(document.createTextNode(text));
      return a;
    }
    const platformOf = (stop) => (stop.prognosis && stop.prognosis.platform) || stop.platform || '–';

    function walkCard(st, n, total) {
      const card = mk('div', 'j-card');
      card.appendChild(kicker('walk', `Step ${n}/${total} · Walk ${st.min} min`));
      card.appendChild(mk('div', 'j-title', `Walk ${st.min} min to ${st.toName}`));
      if (st.next) {
        const s = st.next;
        card.appendChild(take('Then take', s.journey));
        card.appendChild(facts(
          fact('Departs', fmtTime(s.departure.departure), { delay: s.departure.delay }),
          fact(platformWord(s.journey), platformOf(s.departure)),
        ));
        card.appendChild(note(['Start walking at ', fmtTime(st.start)]));
      } else {
        card.appendChild(facts(fact('You arrive', fmtTime(journeyConn.to.arrival))));
        card.appendChild(note(['Follow the dotted line on the map', '']));
      }
      return card;
    }

    function rideCard(st, n, total) {
      const s = st.s, j = s.journey;
      const stops = Math.max(0, j.passList.length - 1);
      const card = mk('div', 'j-card');
      card.appendChild(kicker(modeOf(j.category), `Step ${n}/${total} · Ride ${stops} stop${stops === 1 ? '' : 's'} · ${minutesBetween(s.departure.departure, s.arrival.arrival)} min`));
      card.appendChild(take('', j));
      card.appendChild(mk('div', 'j-title', `Get off at ${s.arrival.station.name}`));
      card.appendChild(facts(
        fact('Departs', fmtTime(s.departure.departure), { delay: s.departure.delay, sub: s.departure.station.name }),
        fact(platformWord(j), platformOf(s.departure)),
      ));
      card.appendChild(note(['Arrive ', fmtTime(s.arrival.arrival), ` at ${platformWord(j)} `, platformOf(s.arrival)]));
      return card;
    }

    function changeCard(st, n, total) {
      const { prev, next } = st;
      const wait = minutesBetween(prev.arrival.arrival, next.departure.departure);
      const sameStation = prev.arrival.station.name === next.departure.station.name;
      const card = mk('div', 'j-card');
      card.appendChild(kicker('change', `Step ${n}/${total} · Change · ${wait} min`));
      card.appendChild(mk('div', 'j-title', sameStation
        ? `Change at ${next.departure.station.name}`
        : `Walk ${st.walkMin || ''} min to ${next.departure.station.name}`.replace('Walk  min', 'Walk')));
      card.appendChild(take('Take', next.journey));
      card.appendChild(facts(
        fact('Departs', fmtTime(next.departure.departure), { delay: next.departure.delay }),
        fact(platformWord(next.journey), platformOf(next.departure)),
      ));
      const pa = platformOf(prev.arrival), pd = platformOf(next.departure);
      if (!sameStation || st.walkMin > 0) card.appendChild(alertLine('walk', `You arrive at ${prev.arrival.station.name}${pa !== '–' ? ', ' + platformWord(prev.journey) + ' ' + pa : ''}`));
      else if (pa !== '–' && pd !== '–' && pa !== pd) card.appendChild(alertLine('change', `Change platform: ${pa} → ${pd}`));
      else card.appendChild(note(['Same platform – stay where you are', '']));
      return card;
    }

    function arriveCard(st, n, total) {
      const card = mk('div', 'j-card');
      card.appendChild(kicker('pin', `Step ${n}/${total} · Arrival`));
      card.appendChild(mk('div', 'j-title', `You arrive at ${st.destTitle}`));
      card.appendChild(facts(fact('Arrival', fmtTime(st.time), { sub: dayLabel(st.time) })));
      if (st.from) card.appendChild(note(['Last stop: ', st.from.arrival.station.name]));
      return card;
    }

    function stepChip(st, i) {
      const chip = mk('button', 'j-chip');
      chip.type = 'button';
      chip.dataset.step = i;
      if (st.type === 'walk') {
        chip.classList.add('walk');
        chip.innerHTML = icon('walk');
        chip.appendChild(document.createTextNode(`${st.min}′`));
      } else if (st.type === 'ride') {
        chip.innerHTML = icon(modeOf(st.s.journey.category));
        chip.appendChild(document.createTextNode(lineLabel(st.s.journey)));
      } else if (st.type === 'change') {
        chip.classList.add('walk');
        chip.innerHTML = icon('change');
        chip.setAttribute('aria-label', 'Change');
      } else {
        chip.innerHTML = icon('pin');
        chip.setAttribute('aria-label', 'Arrival');
      }
      chip.addEventListener('click', () => goToStep(i));
      return chip;
    }

    // ---- Top pill: SBB-style bar, time-proportional, a point at every change, green up to "now" ----
    function renderBar(conn) {
      const bar = document.getElementById('jBar');
      bar.innerHTML = '';
      const t0 = new Date(conn.from.departure).getTime();
      const t1 = new Date(conn.to.arrival).getTime();
      const span = Math.max(1, t1 - t0);
      const pct = (t) => Math.min(100, Math.max(0, ((t - t0) / span) * 100));
      const segs = [];
      const nodes = [0, 100];
      let prevRideEnd = null;
      conn.sections.forEach((s) => {
        let a, b, kind;
        let color = null;
        if (s.journey) {
          a = new Date(s.departure.departure).getTime();
          b = new Date(s.arrival.arrival).getTime();
          kind = 'ride';
          color = MODE_COLOR[modeOf(s.journey.category)];
          if (prevRideEnd != null) nodes.push((prevRideEnd + pct(a)) / 2); // one point per change
          prevRideEnd = pct(b);
        } else {
          a = new Date(s.departure.departure || conn.from.departure).getTime();
          b = s.arrival.arrival ? new Date(s.arrival.arrival).getTime() : a + (s.walk && s.walk.duration || 0) * 1000;
          kind = 'walk';
        }
        if (b > a) segs.push({ kind, color, l: pct(a), w: pct(b) - pct(a) });
      });
      const pts = nodes.sort((x, y) => x - y).filter((x, i, arr) => i === 0 || x === 100 || x - arr[i - 1] > 6);
      // two identical layers: the "done" copy is green and clipped to the progress
      ['', 'done'].forEach((cls) => {
        const layer = mk('div', 'j-layer' + (cls ? ' ' + cls : ''));
        layer.appendChild(mk('span', 'j-base'));
        segs.forEach((sg) => {
          const e = mk('span', `j-seg ${sg.kind}`);
          e.style.left = sg.l + '%';
          e.style.width = sg.w + '%';
          if (sg.color) e.style.setProperty('--seg', sg.color);
          layer.appendChild(e);
        });
        bar.appendChild(layer);
      });
      pts.forEach((x) => {
        const n = mk('span', 'j-node' + (x === 0 || x === 100 ? ' end' : ''));
        n.style.left = x + '%';
        n.dataset.at = x;
        bar.appendChild(n);
      });
      bar.appendChild(mk('span', 'j-now'));
      updateProgress();
    }
    function updateProgress() {
      if (!journeyConn) return;
      const t0 = new Date(journeyConn.from.departure).getTime();
      const t1 = new Date(journeyConn.to.arrival).getTime();
      const p = Math.min(100, Math.max(0, ((Date.now() - t0) / Math.max(1, t1 - t0)) * 100));
      const bar = document.getElementById('jBar');
      bar.style.setProperty('--p', p + '%');
      bar.classList.toggle('live', p > 0 && p < 100);
      bar.querySelectorAll('.j-node').forEach((n) => n.classList.toggle('done', +n.dataset.at <= p && p > 0));
      // map: travelled part green, plus a marker where you should be now
      if (journeySteps.length) { setRoute(stepFeatures(journeySteps)); updateNowMarker(); }
    }

    function renderJourney(conn, destTitle) {
      journeyConn = conn;
      journeySteps = buildSteps(conn, destTitle);
      journeyStep = 0;
      document.getElementById('jDep').textContent = fmtTime(conn.from.departure);
      document.getElementById('jArr').textContent = fmtTime(conn.to.arrival);
      document.getElementById('jTo').textContent = `To ${destTitle}`;
      document.getElementById('jSub').textContent =
        `${dayLabel(conn.from.departure)} · ${fmtDuration(conn.duration)}` +
        (conn.transfers ? ` · ${conn.transfers} change${conn.transfers > 1 ? 's' : ''}` : ' · direct');
      renderBar(conn);
      jStrip.innerHTML = '';
      jTrack.innerHTML = '';
      jDots.innerHTML = '';
      jStatus.textContent = '';
      const total = journeySteps.length;
      journeySteps.forEach((st, i) => {
        jStrip.appendChild(stepChip(st, i));
        const slide = mk('div', 'j-slide');
        slide.appendChild(st.type === 'walk' ? walkCard(st, i + 1, total)
          : st.type === 'ride' ? rideCard(st, i + 1, total)
          : st.type === 'change' ? changeCard(st, i + 1, total)
          : arriveCard(st, i + 1, total));
        jTrack.appendChild(slide);
        const dot = mk('button', 'j-dot');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Step ${i + 1}`);
        dot.addEventListener('click', () => goToStep(i));
        jDots.appendChild(dot);
      });
      setRoute(stepFeatures(journeySteps));
      showStep(false);
      fitJourney(); // overview first; swiping then zooms into each step
    }

    function showStep(fit) {
      jTrack.style.transform = `translateX(${-journeyStep * 100}%)`;
      jStrip.querySelectorAll('.j-chip').forEach((c) => c.classList.toggle('active', +c.dataset.step === journeyStep));
      jDots.querySelectorAll('.j-dot').forEach((d, i) => d.classList.toggle('active', i === journeyStep));
      const active = jStrip.querySelector('.j-chip.active');
      if (active) jStrip.scrollTo({ left: active.offsetLeft - 18, behavior: 'smooth' });
      refreshRouteHighlight();
      if (fit) fitStep(journeyStep);
    }
    function goToStep(i) {
      if (!journeySteps.length) return;
      journeyStep = Math.min(journeySteps.length - 1, Math.max(0, i));
      showStep(true);
    }

    // ---- Swipe: drag the cards with a finger or the mouse; flick or drag past ~1/5 to change card ----
    (function enableSwipe() {
      let id = null, sx = 0, sy = 0, dx = 0, t = 0, decided = false, dragging = false;
      jViewport.addEventListener('pointerdown', (e) => {
        if (!journeySteps.length) return;
        id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; t = performance.now(); decided = false; dragging = false;
      });
      jViewport.addEventListener('pointermove', (e) => {
        if (e.pointerId !== id) return;
        const mx = e.clientX - sx, my = e.clientY - sy;
        if (!decided && (Math.abs(mx) > 6 || Math.abs(my) > 6)) {
          decided = true;
          dragging = Math.abs(mx) > Math.abs(my);
          if (dragging) { jViewport.setPointerCapture(id); jTrack.classList.add('dragging'); }
        }
        if (!dragging) return;
        const last = journeySteps.length - 1;
        dx = mx;
        if ((journeyStep === 0 && dx > 0) || (journeyStep === last && dx < 0)) dx *= 0.3; // rubber band at the ends
        jTrack.style.transform = `translateX(calc(${-journeyStep * 100}% + ${dx}px))`;
      });
      const end = (e) => {
        if (e.pointerId !== id) return;
        id = null;
        if (!dragging) return;
        dragging = false;
        jTrack.classList.remove('dragging');
        const w = jViewport.clientWidth;
        const fast = performance.now() - t < 280 && Math.abs(dx) > 30;
        if (dx < -w * 0.2 || (fast && dx < 0)) goToStep(journeyStep + 1);
        else if (dx > w * 0.2 || (fast && dx > 0)) goToStep(journeyStep - 1);
        else showStep(false);
      };
      jViewport.addEventListener('pointerup', end);
      jViewport.addEventListener('pointercancel', end);
    })();

    function mapPadding() {
      const h = journeyEl.getBoundingClientRect().height || 300;
      return { top: document.body.classList.contains('journey-mode') ? 150 : 80, bottom: h + 40, left: 40, right: 40 };
    }
    function fitCoords(coords) {
      if (!coords.length) return;
      const b = coords.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      map.fitBounds(b, { padding: mapPadding(), maxZoom: 17, duration: 700 });
    }
    function fitJourney() {
      const all = [];
      journeySteps.forEach((st) => all.push(...stepCoords(st)));
      requestAnimationFrame(() => fitCoords(all));
    }
    function fitStep(i) {
      const st = journeySteps[i];
      if (st) fitCoords(stepCoords(st));
    }

    async function startJourney(r, keepQuery) {
      const id = ++journeyReq;
      if (!keepQuery) journeyQuery = { mode: 'dep', date: '', time: '' };
      journeyDest = r;
      journeyConn = null;
      journeySteps = [];
      wrap.classList.remove('collapsed');
      wrap.classList.add('journey-open');
      document.body.classList.add('journey-mode');
      setMenu(false);
      jStrip.innerHTML = '';
      jTrack.innerHTML = '';
      jDots.innerHTML = '';
      document.getElementById('jBar').innerHTML = '';
      document.getElementById('jDep').textContent = '--:--';
      document.getElementById('jArr').textContent = '--:--';
      document.getElementById('jTo').textContent = `To ${r.title}`;
      document.getElementById('jSub').textContent = '';
      jStatus.textContent = 'Finding a connection…';
      setRoute([]);
      if (!keepQuery) map.flyTo({ center: r.lngLat, zoom: 14, speed: 1.4, offset: [0, -150] }); // keep the pin above the widget
      clearInterval(progressTimer);
      progressTimer = setInterval(updateProgress, 15000);

      const from = userLngLat || map.getCenter().toArray();
      try {
        const conn = await findConnection(from, r);
        if (id !== journeyReq) return;
        if (!conn) { jStatus.textContent = 'No public transport connection found for this trip.'; return; }
        renderJourney(conn, r.title);
        refineJourney(id); // swap straight lines for real walking paths and tracks/roads
        if (!userLngLat) document.getElementById('jSub').textContent += ' · from map centre';
      } catch (e) {
        if (id === journeyReq) jStatus.textContent = 'Connections could not be loaded. Check your internet connection.';
      }
    }

    // ---- Time picker: tap the departure or arrival time ----
    const tSheet = document.getElementById('tSheet');
    const tDim = document.getElementById('tDim');
    const tDate = document.getElementById('tDate');
    const tTime = document.getElementById('tTime');
    let tMode = 'dep';
    const pad2 = (n) => String(n).padStart(2, '0');
    const dateValue = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const timeValue = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    function setTMode(m) {
      tMode = m;
      document.querySelectorAll('#tSeg button').forEach((b) => b.classList.toggle('active', b.dataset.mode === m));
    }
    function openTimeSheet(mode) {
      if (!journeyDest) return;
      setTMode(mode);
      const ref = journeyConn ? new Date(mode === 'arr' ? journeyConn.to.arrival : journeyConn.from.departure) : new Date();
      tDate.value = journeyQuery.date || dateValue(ref);
      tTime.value = journeyQuery.time || timeValue(ref);
      if (journeyQuery.mode !== mode && journeyConn) { tDate.value = dateValue(ref); tTime.value = timeValue(ref); }
      tSheet.classList.add('open');
      tDim.classList.add('open');
      tSheet.setAttribute('aria-hidden', 'false');
    }
    function closeTimeSheet() {
      tSheet.classList.remove('open');
      tDim.classList.remove('open');
      tSheet.setAttribute('aria-hidden', 'true');
    }
    document.getElementById('jDepBtn').addEventListener('click', () => openTimeSheet('dep'));
    document.getElementById('jArrBtn').addEventListener('click', () => openTimeSheet('arr'));
    document.querySelectorAll('#tSeg button').forEach((b) => b.addEventListener('click', () => setTMode(b.dataset.mode)));
    tDim.addEventListener('click', closeTimeSheet);
    document.getElementById('tNow').addEventListener('click', () => {
      journeyQuery = { mode: 'dep', date: '', time: '' };
      closeTimeSheet();
      startJourney(journeyDest, true);
    });
    document.getElementById('tDone').addEventListener('click', () => {
      journeyQuery = { mode: tMode, date: tDate.value, time: tTime.value };
      closeTimeSheet();
      startJourney(journeyDest, true);
    });

    // ---------- Accurate route shapes ----------
    // Timetables only give stop coordinates, so the lines between them are routed:
    //   walking → OSM foot routing (routing.openstreetmap.de), trains → BRouter rail profile (brouter.de),
    //   buses/trams → OSM road routing. Anything implausible falls back to the straight line.
    const routeCache = new Map();
    function getJSON(url) {
      if (!routeCache.has(url)) routeCache.set(url, fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null));
      return routeCache.get(url);
    }
    function distKm(a, b) {
      const R = 6371, toRad = Math.PI / 180;
      const dLat = (b[1] - a[1]) * toRad, dLng = (b[0] - a[0]) * toRad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * toRad) * Math.cos(b[1] * toRad) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }
    const lengthKm = (cs) => cs.reduce((sum, c, i) => (i ? sum + distKm(cs[i - 1], c) : 0), 0);
    const plausible = (route, straight) => route && route.length > 1 && lengthKm(route) <= Math.max(lengthKm(straight) * 2.5, lengthKm(straight) + 0.4);
    const ll = (c) => `${c[0].toFixed(6)},${c[1].toFixed(6)}`;

    async function routeWalk(a, b) {
      if (distKm(a, b) < 0.02) return [a, b];
      const d = await getJSON(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${ll(a)};${ll(b)}?overview=full&geometries=geojson`);
      const g = d && d.code === 'Ok' && d.routes[0] && d.routes[0].geometry.coordinates;
      return plausible(g, [a, b]) ? [a, ...g, b] : [a, b];
    }

    async function routeRide(path, mode) {
      if (path.length < 2) return path;
      let g = null;
      if (mode === 'train') {
        const d = await getJSON(`https://brouter.de/brouter?lonlats=${path.map(ll).join('|')}&profile=rail&alternativeidx=0&format=geojson`);
        g = d && d.features && d.features[0] && d.features[0].geometry.coordinates.map((c) => [c[0], c[1]]);
      } else if (mode === 'bus' || mode === 'tram') {
        const d = await getJSON(`https://routing.openstreetmap.de/routed-car/route/v1/driving/${path.map(ll).join(';')}?overview=full&geometries=geojson`);
        g = d && d.code === 'Ok' && d.routes[0] && d.routes[0].geometry.coordinates;
      }
      return plausible(g, path) ? [path[0], ...g, path[path.length - 1]] : path;
    }

    function refineJourney(id) {
      let pending = 0, scheduled = false;
      const redraw = () => {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(() => { scheduled = false; if (id === journeyReq) { setRoute(stepFeatures(journeySteps)); updateNowMarker(); } });
      };
      const task = (promise, apply) => {
        pending++;
        promise.then((res) => { if (id !== journeyReq) return; apply(res); redraw(); });
      };
      journeySteps.forEach((st) => {
        (st.lines || []).forEach((line, k) => task(routeWalk(line[0], line[line.length - 1]), (res) => { st.lines[k] = res; }));
        if (st.type === 'ride') task(routeRide(st.path, modeOf(st.s.journey.category)), (res) => { st.path = res; });
      });
    }

    // Timetable data: transport.opendata.ch (the official Swiss timetable, incl. SBB, PostBus, city transport)
    const OPENDATA = 'https://transport.opendata.ch/v1/';
    const coordParam = (ll) => `${ll[1].toFixed(6)},${ll[0].toFixed(6)}`; // lat,lng
    async function nearestStation(ll) {
      const res = await fetch(`${OPENDATA}locations?` + new URLSearchParams({ x: ll[1], y: ll[0], type: 'station' }));
      const data = await res.json();
      const st = (data.stations || []).find((x) => x.id);
      return st ? st.id : null;
    }
    async function connections(from, to) {
      if (!from || !to) return null;
      const q = { from, to, limit: '5' };
      const { mode, date, time } = journeyQuery;
      if (date) q.date = date;
      if (time) q.time = time;
      if (mode === 'arr' && (date || time)) q.isArrivalTime = '1';
      const res = await fetch(`${OPENDATA}connections?` + new URLSearchParams(q));
      const data = await res.json();
      const list = data.connections || [];
      if (!list.length) return null;
      if (mode === 'arr' && (date || time)) {
        // latest connection that still arrives by the chosen time
        const target = new Date(`${date || dateValue(new Date())}T${time || timeValue(new Date())}`).getTime();
        const ok = list.filter((c) => new Date(c.to.arrival).getTime() <= target + 60000);
        return (ok.length ? ok : list).reduce((best, c) => (new Date(c.to.arrival) > new Date(best.to.arrival) ? c : best));
      }
      const after = date || time
        ? new Date(`${date || dateValue(new Date())}T${time || timeValue(new Date())}`).getTime() - 60000
        : Date.now() - 60000;
      return list.find((c) => new Date(c.from.departure).getTime() >= after) || list[0];
    }
    // Exact coordinates can fail when a point is far from any stop (e.g. a municipality's centre in the fields),
    // so fall back to the place name and then to the nearest stations at either end.
    async function findConnection(fromLL, r) {
      const from = coordParam(fromLL), to = coordParam(r.lngLat);
      let c = await connections(from, to);
      if (c) return c;
      if (r.origin === 'gg25' || r.origin === 'gazetteer') {
        c = await connections(from, r.title.replace(/\s*\([A-Z]{2}\)\s*$/, ''));
        if (c) return c;
      }
      const toStation = await nearestStation(r.lngLat);
      c = await connections(from, toStation);
      if (c) return c;
      const fromStation = await nearestStation(fromLL);
      return connections(fromStation, toStation);
    }

    function endJourney() {
      journeyReq++;
      wrap.classList.remove('journey-open');
      document.body.classList.remove('journey-mode');
      clearInterval(progressTimer);
      journeyConn = null;
      journeyDest = null;
      nowMarker.remove();
      closeTimeSheet();
      setRoute([]);
      journeySteps = [];
      destMarker.remove();
      input.value = '';
      results = [];
      clearBtn.classList.remove('show');
      render();
      if (userLngLat) map.flyTo({ center: userLngLat, zoom: 15 });
    }
    document.getElementById('jClose').addEventListener('click', endJourney);

    // ---------- Event page (URL: #event/<id>, so the back gesture/button works) ----------
    const evPage = document.getElementById('evPage');
    const evHero = document.getElementById('evHero');
    const evContent = document.getElementById('evContent');
    let pageEvent = null;
    let pushedHash = false;

    const findEvent = (id) => EVENTS_FC.features.find((f) => f.properties.id === id);

    function openEvent(id) {
      pushedHash = true;
      location.hash = 'event/' + encodeURIComponent(id);
    }

    function renderEventPage(f) {
      const p = f.properties;
      pageEvent = f;
      evHero.style.setProperty('--c', p.color);
      evContent.style.setProperty('--c', p.color);
      [...evHero.children].forEach((n) => { if (n.id !== 'evBack') n.remove(); });
      evHero.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${EVENTS.GLYPHS[p.cat]}"/></svg>`);
      if (p.image) {
        const img = document.createElement('img');
        img.src = p.image;
        img.alt = '';
        img.onerror = () => img.remove();
        evHero.appendChild(img);
      }
      document.getElementById('evCat').textContent = p.category;
      document.getElementById('evTitle').textContent = p.title;
      document.getElementById('evWhen').textContent = p.when;
      document.getElementById('evDuration').textContent = 'Duration ' + p.duration;
      document.getElementById('evVenue').textContent = p.venue;
      document.getElementById('evCity').textContent = p.city;
      document.getElementById('evAbout').textContent = p.about;
      document.getElementById('evAudience').textContent = p.audience;
      evPage.scrollTop = 0;
    }

    function routeFromHash() {
      const m = location.hash.match(/^#event\/(.+)$/);
      const f = m && findEvent(decodeURIComponent(m[1]));
      if (f) {
        renderEventPage(f);
        input.blur();
        setMenu(false);
        evPage.classList.add('open');
        evPage.setAttribute('aria-hidden', 'false');
      } else {
        evPage.classList.remove('open');
        evPage.setAttribute('aria-hidden', 'true');
      }
    }

    function closeEvent() {
      if (pushedHash) { pushedHash = false; history.back(); }
      else history.replaceState(null, '', location.pathname + location.search);
      routeFromHash();
    }

    window.addEventListener('hashchange', () => { if (!location.hash) pushedHash = false; routeFromHash(); });
    document.getElementById('evBack').addEventListener('click', closeEvent);
    document.getElementById('evShowMap').addEventListener('click', () => {
      const f = pageEvent;
      closeEvent();
      if (f) map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 16), speed: 1.4 });
    });
    routeFromHash(); // a shared #event/… link opens straight on the page

    // ---------- Keep the bar above the iOS keyboard ----------
    if (window.visualViewport) {
      const vv = window.visualViewport;
      const place = () => {
        const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
        wrap.style.bottom = kb > 0 ? (kb + 8) + 'px' : '';
        list.style.maxHeight = kb > 0 ? (vv.height - 52 - 40) + 'px' : '';
      };
      vv.addEventListener('resize', place);
      vv.addEventListener('scroll', place);
    }
  </script>
</body>
</html>
