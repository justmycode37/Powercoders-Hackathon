<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16191e" />
    <meta name="description" content="Door-to-door public transport in Switzerland: the exact bay, platform and sector, at your walking speed." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kante" />
    <title>Kante</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://vectortiles.geo.admin.ch" crossorigin />
    <style>
      /* first paint, before any script: the shell's shape in the right colours */
      html,body{height:100%;margin:0;background:#e6e8ec;font:100%/1.25 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .boot-sheet{position:fixed;left:0;right:0;top:44vh;bottom:0;background:#fff;box-shadow:0 -1px 2px rgba(10,12,16,.1),0 -6px 20px rgba(10,12,16,.1)}
      .boot-pill{position:fixed;top:calc(44vh - 49px);left:6.5%;right:6.5%;height:58px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(10,12,16,.16),0 2px 8px rgba(10,12,16,.1);display:flex;align-items:center;padding:0 20px;color:#14161a;font-weight:500;font-size:18px}
      @media (min-width:900px){.boot-pill{left:16px;right:auto;width:388px;top:12px;box-shadow:inset 0 0 0 1px #e3e5e9}.boot-sheet{top:0;right:auto;width:420px}}
      @media (prefers-color-scheme:dark){html,body{background:#12151a}.boot-pill,.boot-sheet{background:#16191e;color:#f2f3f5}}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-sheet"></div>
      <div class="boot-pill">Where to?</div>
    </div>
    <noscript>Kante needs JavaScript to run. Please enable it in your browser settings.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
